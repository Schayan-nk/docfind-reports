  const box = document.createElement('div');
  box.className = 'sugg';
  box.id = 'suggpop';
  box.setAttribute('role', 'listbox');
  // At least as wide as the field it belongs to; wider if a name needs it.
  box.style.minWidth = Math.round(input.getBoundingClientRect().width) + 'px';
  box.style.maxWidth = Math.round(Math.min(innerWidth - 24, 420)) + 'px';
  // Into the body, for the reason the date picker is -- see .sugg.
  document.body.appendChild(box);
  openSugg = box; suggAnchor = input; suggValues = []; suggAt = -1; suggPick = null;
  input.setAttribute('aria-expanded', 'true');

  // Once per box, here rather than in suggShow.
  //
  // suggShow reuses this box for as long as the field keeps it, so registering
  // the handler there added another one on every keystroke. They all fire on
  // the one click: the first took the name and closed the list, and closing
  // empties suggValues -- so the next handler read suggValues[i] of an empty
  // array, got undefined, and wrote that into the filter. The field then said
  // "undefined" and the report matched nothing, which is what somebody
  // choosing a name from a list saw.
  //
  // mousedown, not click: a click fires after the field has already lost
  // focus, and the blur handler would have closed the list first.
  box.addEventListener('mousedown', e => {
    const it = e.target.closest('.sugg-item');
    if (!it) return;
    e.preventDefault();
    const v = suggValues[+it.dataset.i];
    // Nothing to take is a no-op, not a filter set to nothing. Whatever the
    // reader clicked, they did not ask for an empty result.
    if (v === undefined || !suggPick) return;
    suggPick(v);
  });

  addEventListener('scroll', repositionSugg, true);
  addEventListener('resize', repositionSugg);
  return box;
}

// The typed part, picked out inside each suggestion. Escaped in three pieces
// rather than escaping the whole string and searching in that: escaping
// lengthens the text -- & becomes &amp; -- so an offset found in the escaped
// copy would no longer point at the same character.
function suggMark(v, typed) {
  if (!typed) return esc(v);
  const i = v.toLowerCase().indexOf(typed.toLowerCase());
  if (i < 0) return esc(v);
  return esc(v.slice(0, i)) +
         '<b>' + esc(v.slice(i, i + typed.length)) + '</b>' +
         esc(v.slice(i + typed.length));
}

function suggLoading(input) {
  const box = suggBox(input);
  // Only when there is nothing already in it. A list that has results and is
  // refreshing them should keep showing the old ones rather than replace them
  // with a spinner the reader then has to wait out.
  if (box.querySelector('.sugg-item')) return;
  box.innerHTML =
    '<div class="sugg-load" role="status">' +
      '<span class="sugg-dots" aria-hidden="true"><i></i><i></i><i></i></span>' +
      '<span>در حال یافتن گزینه‌ها…</span>' +
    '</div>';
  placePicker(box, input);
}

function suggShow(input, values, typed, onPick) {
  const lower = typed.toLowerCase();
  const shown = (typed ? values.filter(v => v.toLowerCase().includes(lower)) : values)
    .slice(0, 40);
  const box = suggBox(input);
  // Set together, and only here: the rendered rows carry an index into
  // suggValues, so the two must never be replaced independently.
  suggValues = shown; suggAt = -1; suggPick = onPick;
  input.removeAttribute('aria-activedescendant');

  if (!shown.length) {
    // Said rather than left blank, and it says the field still works: these
    // suggestions are one table's worth and a filter may match more.
    box.innerHTML = '<div class="sugg-empty">' +
      (typed ? 'گزینه‌ای با این نام نیست؛ می‌توانید آزاد بنویسید.'
             : 'گزینه‌ای برای پیشنهاد نیست.') + '</div>';
    placePicker(box, input);
    return;
  }

  box.innerHTML = shown.map((v, i) =>
    '<button type="button" class="sugg-item" role="option" aria-selected="false"' +
    ' id="sugg-o' + i + '" data-i="' + i + '">' + suggMark(v, typed) + '</button>'
  ).join('');

  placePicker(box, input);
}

// Which row the keyboard is on. Kept as a class and an aria-activedescendant
// rather than by moving focus: focus has to stay in the field so the reader
// can keep typing, which is the whole difference between this and a <select>.
function suggMove(input, delta) {
  if (!openSugg || !suggValues.length) return;
  const items = [...openSugg.querySelectorAll('.sugg-item')];
  if (!items.length) return;
  if (suggAt >= 0) {
    items[suggAt].classList.remove('on');
    items[suggAt].setAttribute('aria-selected', 'false');
  }
  // Wraps, and steps off the end back to "nothing chosen" so there is always
  // a way back to what was typed.
  suggAt += delta;
  if (suggAt < -1) suggAt = items.length - 1;
  if (suggAt >= items.length) suggAt = -1;
  if (suggAt < 0) { input.removeAttribute('aria-activedescendant'); return; }
  const it = items[suggAt];
  it.classList.add('on');
  it.setAttribute('aria-selected', 'true');
  it.scrollIntoView({ block: 'nearest' });
  input.setAttribute('aria-activedescendant', it.id);
}

async function loadSuggestions(rep, param, input, onPick) {
  const typed = input.value.trim();
  const key = rep.id + '|' + param + '|' + typed.slice(0, 3);
  if (suggestCache.has(key)) {
    suggShow(input, suggestCache.get(key), typed, onPick);
    return;
  }
  suggLoading(input);
  try {
    const r = await api('/api/reports/suggest?id=' + encodeURIComponent(rep.id) +
      '&param=' + encodeURIComponent(param) + '&q=' + encodeURIComponent(typed));
    if (!r.ok) { closeSugg(); return; }
    const d = await r.json();
    suggestCache.set(key, d.values || []);
    // The field may have moved on while this was in flight -- a second
    // keystroke opens the box for the same field, but a click elsewhere
    // closes it, and answering into a closed box would pop it back open
    // under whatever the reader is doing now.
    if (suggAnchor !== input) return;
    suggShow(input, d.values || [], input.value.trim(), onPick);
  } catch (e) {
    // Suggestions are a convenience; typing still works.
    if (suggAnchor === input) closeSugg();
  }
}

// --------------------------------------------------- multi-value filters
//
// A filter that takes several values at once -- two or three companies, a
// handful of colleagues -- and matches a row carrying any of them. The chosen
// values sit in the box as removable tokens and the reader keeps typing beside
// them.
//
// The selection is held as newline-separated text on a hidden field carrying
// the id every other part of this page already uses for a filter,
// $('f-<name>'). collectParams, filterSummary, the CSV export, پاک کردن and a
// click on the chart all address a filter that way, and keeping it true is what
// makes a token field a drop-in rather than five callers taught about tokens.
//
// Newlines rather than commas, which is what KindList splits on: a company may
// be filed as "Example Trading Co (North)" and could as easily carry a comma,
// and splitting on one would search for two firms that do not exist.
// internal/reports/bind.go splits the value on the same character.
function chipValues(name) {
  const box = $('f-' + name);
  if (!box) return [];
  return String(box.value || '').split('\n').map(s => s.trim()).filter(Boolean);
}

// chipsShow paints one filter's tokens from its stored value.
function chipsShow(name) {
  const list = $('f-' + name + '-chips');
  if (!list) return;
  list.innerHTML = chipValues(name).map((v, i) =>
    '<span class="chip-tok"><span class="t">' + esc(v) + '</span>' +
    '<button type="button" class="x" data-i="' + i + '" tabindex="0"' +
    ' aria-label="' + esc('حذف ' + v) + '">×</button></span>').join('');
}

// chipsSet stores a selection and repaints it, and says whether anything
// actually changed -- so a duplicate pick does not re-run the report.
function chipsSet(name, vals) {
  const box = $('f-' + name);
  if (!box) return false;
  const seen = new Set(), out = [];
  for (const v of vals) {
    const t = String(v === undefined || v === null ? '' : v).trim();
    // De-duplicated: choosing the same name twice is not a second filter, and
    // it would put the same branch into the pattern twice.
    if (t && !seen.has(t)) { seen.add(t); out.push(t); }
  }
  const next = out.join('\n');
  if (next === box.value) return false;
  box.value = next;
  chipsShow(name);
  return true;
}

function chipsAdd(name, v) { return chipsSet(name, chipValues(name).concat([v])); }

function chipsRemove(name, i) {
  const vals = chipValues(name);
  if (!(i >= 0 && i < vals.length)) return false;
  vals.splice(i, 1);
  return chipsSet(name, vals);
}

// chipsTake moves whatever is in the typing field into the tokens.
//
// This is what keeps the oldest habit working: type a name, press Enter or
// اعمال فیلتر, get that name. Text still sitting in the box is not in the value
// the query reads, so it has to be taken first or the filter would apply as
// though nothing had been typed.
function chipsTake(name, input) {
  const typed = (input.value || '').trim();
  input.value = '';
  if (!typed) return false;
  return chipsAdd(name, typed);
}

// chipsSync repaints every token field on the page from its stored value and
// empties the typing boxes.
//
// For the paths that assign to a filter rather than going through the tokens --
// پاک کردن, and a click on a chart category. Both write to $('f-<name>').value,
// which is the right thing to write to and shows nothing on its own.
function chipsSync(rep) {
  (rep.params || []).forEach(p => {
    if (p.kind !== 'anyof') return;
    const typing = $('f-' + p.name + '-type');
    if (typing) typing.value = '';
    chipsShow(p.name);
  });
}

// --------------------------------------------------------------- the list
function showList() {
  destroyChart(); destroyMonthly();
  $('pageTitle').textContent = 'گزارش‌ها';
  // The builder, for those who hold it: where a new report is written. Its
  // permissions are given to named accounts, never by a role, so being an
  // administrator is not enough.
  const holds = id => !!(me && (me.permissions || []).includes(id));
  const builderCard = holds('page:builder')
    ? '<div class="cards"><a class="card-link analysis-card" href="/builder">' +
        '<span class="t">ساختن گزارش</span>' +
        '<span class="d">اتصال به پایگاه داده، نوشتن پرس‌وجو، فیلتر و نمودار، و ذخیره به‌عنوان گزارش</span>' +
        '<span class="m"><span class="chip chip-accent">SQL</span></span>' +
      '</a></div>'
    : '';
  if (!catalogue.length) {
    $('main').innerHTML = builderCard + '<div class="widget"><div class="note">' +
      (unconfigured
        ? 'هنوز گزارشی روی این سرور تعریف نشده است. پوشهٔ فایل‌های SQL گزارش‌ها را با گزینهٔ ' +
          '<code dir="ltr">-reports</code> و پایگاه دادهٔ آن‌ها را با متغیرهای ' +
          '<code dir="ltr">DOCFIND_DB_*</code> مشخص کنید و سرویس را دوباره راه‌اندازی کنید.'
        : 'هیچ گزارشی به شما اختصاص داده نشده است.') + '</div></div>';
    return;
  }

  const card = r =>
      '<a class="card-link" href="#/' + encodeURIComponent(r.id) + '">' +
        '<span class="t">' + esc(r.title) + '</span>' +
        (r.description ? '<span class="d">' + esc(r.description) + '</span>' : '') +
        '<span class="m">' +
          (r.chart ? '<span class="chip">نمودار</span>' : '') +
          '<span>' + (r.params && r.params.length
            ? faFull.format(r.params.length) + ' فیلتر' : 'بدون فیلتر') + '</span>' +
        '</span>' +
      '</a>';
  // A family («گزارش انبارها») is one card where its first member stood,
  // opening that member; the others are chosen on the report's own page.
  const listed = [];
  const families = new Set();
  for (const r of catalogue) {
    if (!r.family) { listed.push(r); continue; }
    if (families.has(r.family)) continue;
    families.add(r.family);
    const members = catalogue.filter(m => m.family === r.family);
    if (members.length < 2) { listed.push(r); continue; }
    listed.push(Object.assign({}, r, {
      title: r.family_title || r.title,
      description: [...new Set(members.map(m => m.variant[0]))].join('، '),
    }));
  }

  // Reports that declare a group -- the accounting three, from the finance
  // server -- get a heading and a grid of their own under the general list,
  // named as the menu names them.
  const groups = [...new Set(listed.map(r => r.group).filter(Boolean))];

  $('main').innerHTML = builderCard +
    '<div class="cards-rest">' + listed.filter(r => !r.group).map(card).join('') + '</div>' +
    groups.map(g => '<h2 class="cards-group">' + esc(g) + '</h2>' +
      '<div class="cards-rest">' + listed.filter(r => r.group === g).map(card).join('') + '</div>').join('');
}

// ------------------------------------------------------------- the report
function filterHTML(rep) {
  if (!rep.params || !rep.params.length) return '';
  const hint = { like: 'شامل…', date: 'YYYY/MM/DD', list: 'با کاما جدا کنید',
                 anyof: 'یک یا چند…', text: '' };

  // A token field's <label> has to name the box the reader types in, not the
  // hidden field the query reads: a label pointing at something not rendered
  // moves focus nowhere when it is clicked and announces nothing.
  const labelTarget = p => 'f-' + esc(p.name) + (p.kind === 'anyof' ? '-type' : '');

  // The aria-* that say "arrows do something here". Shared by the plain
  // suggestion fields and the token ones, which are the same control from a
  // screen reader's point of view.
  const combobox = ' role="combobox" aria-expanded="false" aria-controls="suggpop"' +
                   ' aria-autocomplete="list" aria-haspopup="listbox" autocomplete="off"';

  // A parameter carrying options becomes a dropdown. The values are raw
  // database strings ("TO_DO", "1") and the labels are Persian, so a text box
  // here invites someone to type "در جریان" against a column holding "TO_DO"
  // and get nothing back with nothing on screen explaining why.
  const field = p => {
    const id = 'f-' + esc(p.name);
    if (p.options && p.options.length) {
      const chosen = p.default || '';
      // A required choice switches what is shown -- with or without VAT --
      // so it has no «همه»: "all" means nothing there.
      const opts = (p.required ? [] : ['<option value="">همه</option>']).concat(p.options.map(o =>
        '<option value="' + esc(o.value) + '"' +
        (o.value === chosen ? ' selected' : '') + '>' + esc(o.label) + '</option>'));
      return '<select id="' + id + '" data-p="' + esc(p.name) + '">' + opts.join('') + '</select>';
    }
    // Several values in one filter: the tokens, the box to type in, and the
    // hidden field that holds the selection under the id the rest of the page
    // reads. See the multi-value section above for why it is arranged this way.
    if (p.kind === 'anyof') {
      return '<span class="chipfield" id="' + id + '-box">' +
               '<span class="chips" id="' + id + '-chips"></span>' +
               '<input id="' + id + '-type" class="chiptype"' +
               (p.suggestable ? combobox : ' autocomplete="off"') +
               ' inputmode="text" placeholder="' + esc(hint.anyof) + '">' +
               '<input type="hidden" id="' + id + '" data-p="' + esc(p.name) + '"' +
               ' value="' + esc(p.default || '') + '">' +
             '</span>';
    }
    const isDate = p.kind === 'date';
    // A combobox: a text field that also offers a list, which is what these
    // are. role and the aria-* attributes are what tell a screen reader that
    // arrows do something here -- the native datalist said it for us.
    return '<input id="' + id + '" data-p="' + esc(p.name) + '"' +
           ' value="' + esc(p.default || '') + '"' +
           (isDate ? ' class="datefield" readonly data-cal="' +
                     esc(p.calendar || 'jalali') + '"' : '') +
           (p.suggestable ? combobox : '') +
           ' inputmode="' + (isDate ? 'numeric' : 'text') + '"' +
           ' placeholder="' + esc(isDate ? (p.calendar === 'gregorian' ? 'میلادی' : 'شمسی')
                                         : (hint[p.kind] || '')) + '">';
  };

  return '<div class="filters">' + rep.params.map(p =>
      '<div' + (p.kind === 'date' ? ' class="datewrap"' : '') + '>' +
        '<label for="' + labelTarget(p) + '">' + esc(p.label || p.name) + '</label>' +
        '<span class="ring">' + field(p) + '</span>' +
        // Said once under each token field, because a box that takes several
        // values is not a control most readers here have met.
        (p.kind === 'anyof' ? '<span class="chiphint">چند مورد مجاز است</span>' : '') +
      '</div>').join('') +
    '<div class="apply">' +
      '<button class="btn primary" id="applyBtn">اعمال فیلتر</button>' +
      '<button class="btn" id="clearBtn">پاک کردن</button>' +
    '</div></div>';
}

function collectParams(rep) {
  const out = {};
  (rep.params || []).forEach(p => { const el = $('f-' + p.name); if (el) out[p.name] = el.value; });
  return out;
}

// A family's choice (-- family / -- variant): the first dropdown, and the
// second where the first choice is between several reports -- a «گزارش
// انبارها» family, say, choosing the warehouse and then one of its ledgers. Only
// the members this reader may open are in the catalogue, so only they are
// offered. A choice opens that member's own page.
function familyBar(rep) {
  const members = rep.family ? catalogue.filter(r => r.family === rep.family) : [];
  if (members.length < 2 || !rep.variant || !rep.variant.length) return '';
  const levels = rep.family_levels || [];
  const firsts = [...new Set(members.map(r => r.variant[0]))];
  const seconds = members.filter(r => r.variant[0] === rep.variant[0] && r.variant.length > 1);
  const select = (id, label, values, current) =>
    '<label class="family-pick"><span>' + esc(label) + '</span>' +
      '<select class="input" id="' + id + '">' +
        values.map(v => '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(v) + '</option>').join('') +
      '</select></label>';
  return '<div class="family-bar">' +
    select('famPick1', levels[0] || rep.family_title || 'گزارش', firsts, rep.variant[0]) +
    (seconds.length > 1 ? select('famPick2', levels[1] || 'نوع', seconds.map(r => r.variant[1]), rep.variant[1]) : '') +
  '</div>';
}
function wireFamilyBar(rep) {
  const members = catalogue.filter(r => r.family === rep.family);
  const go = r => { if (r && r.id !== rep.id) location.hash = '#/' + encodeURIComponent(r.id); };
  const a = $('famPick1'), b = $('famPick2');
  if (a) a.onchange = () => go(
    members.find(r => r.variant[0] === a.value && r.variant[1] === rep.variant[1]) ||
    members.find(r => r.variant[0] === a.value));
  if (b) b.onchange = () => go(members.find(r => r.variant[0] === rep.variant[0] && r.variant[1] === b.value));
}

function showReport(id) {
  const rep = catalogue.find(r => r.id === id);
  if (!rep) { location.hash = ''; return; }
  destroyChart(); destroyMonthly();
  const title = rep.family_title && familyBar(rep) ? rep.family_title : rep.title;
  $('pageTitle').textContent = title;
  $('main').innerHTML =
    crumbBar(title) +
    '<section class="widget">' +
      '<h2>' + esc(title) +
        '<span class="spacer"></span>' +
        '<button class="btn" id="refreshBtn">بازخوانی</button>' +
        '<button class="btn" id="exportBtn">خروجی CSV</button>' +
        '<button class="btn" id="repPdf">' + PDF_ICON + '<span>خروجی PDF</span></button>' +
      '</h2>' +
      familyBar(rep) +
      filterHTML(rep) +
      // The well exists whenever the report can say ANYTHING about periods --
      // which is every report, because the ones that cannot be compared carry
      // a written reason instead. Gating this on monthly_column alone is how
      // the panel went missing from exactly the two reports it was written
      // for: the route answered correctly, loadMonthly ran, and its first line
      // returned because there was no element to draw into.
      ((rep.monthly_column || rep.monthly_why_not)
        ? '<div id="monthlywell" data-print-section="روند ماهانه">' + skeleton(1) + '</div>' : '') +
      (rep.chart ? '<div class="chartwell" id="chartwell" data-print-section="نمودار">' + skeleton(1) + '</div>' : '') +
      '<div id="body" data-print-section="جدول">' + skeleton(7) + '</div>' +
    '</section>';

  wireFamilyBar(rep);

  // A click on a chart bar fills the filter that matches the chart's own
  // category and re-runs the report. Which filter that is comes from the
  // report's declaration, not a guess: the chart names its label column, and
  // the parameter carrying the same heading is the one to set.
  window.filterByChartLabel = label => {
    // Only the filter whose heading is the chart's own category.
    //
    // There used to be a fallback here: with no match, the first filter that
    // could offer suggestions. That is worse than doing nothing, and it was
    // doing it on four of the eight charted reports -- clicking an expert's
    // bar on مناقصات در جریان searched نام مشتری for a person's name and
    // returned an empty table, which reads as "this expert has no tenders".
    // A click that cannot be honoured now leaves the report alone.
    const target = (rep.params || []).find(p =>
      p.label && p.label === (chartCategory[rep.id] || ''));
    if (!target) return;
    const el = $('f-' + target.name);
    if (!el) return;
    if (el.tagName === 'SELECT') {
      // A dropdown is matched on what it says, not on what it stores: the
      // chart is drawn from the readable column and the option values are the
      // raw ones underneath it. Assigning a value the control has no option
      // for silently leaves it where it was.
      const want = String(label).trim();
      const opt = [...el.options].find(o => o.value.trim() === want) ||
                  [...el.options].find(o => o.textContent.trim() === want);
      if (!opt) return;
      el.value = opt.value;
    } else {
      el.value = label;
    }
    // On a token field this replaces the whole selection with the category
    // clicked, which is what a click on a chart means -- "show me this one".
    // The tokens have to be repainted for it, and the field to focus is the
    // box the reader types in rather than the hidden one holding the value.
    if (target.kind === 'anyof') {
      chipsShow(target.name);
      const typing = $('f-' + target.name + '-type');
      if (typing) typing.focus();
    } else {
      el.focus();
    }
    run(rep, 1, true);
  };

  // A click on a month narrows the report to that month.
  //
  // The bounds are set as text on the two date filters. Because Jalali dates
  // are stored zero-padded ("1404/03/09"), a plain string comparison is
  // already chronological -- so an upper bound of /31 covers a thirty-day
  // month exactly and still cannot reach into the next one, no calendar
  // arithmetic and no leap-year special case.
  window.filterByMonth = key => {
    const dates = (rep.params || []).filter(p => p.kind === 'date');
    if (dates.length < 2) return;
    const from = $('f-' + dates[0].name), to = $('f-' + dates[1].name);
    if (!from || !to) return;
    from.value = key + '/01';
    to.value = key + '/31';
    run(rep, 1, true);
  };

  // The masthead says which filters produced the sheet, and which part of the
  // data is on it.
  //
  // The second half is the one that matters. A report is paged, so an export
  // carries the page the reader is looking at and not the whole result -- and
  // a printed table with no statement of that is indistinguishable from the
  // complete answer. It gets quoted in a meeting as the complete answer. So
  // the page number and the row count are printed, and when there is more
  // behind it the sheet says so and names the export that does carry
  // everything.
  const pdf = $('repPdf');
  if (pdf) pdf.addEventListener('click', () => {
    const st = state[rep.id] || {};
    const lines = filterSummary(rep);
    if (st.shown) {
      lines.push('صفحه ' + faFull.format(st.page || 1) +
                 '، ' + faFull.format(st.shown) + ' ردیف');
    }
    if (st.hasMore) {
      lines.push('این برگه فقط ردیف‌های همین صفحه را دارد؛ برای همهٔ ردیف‌ها خروجی CSV بگیرید');
    }
    exportPDF(rep.title, lines);
  });

  const apply = $('applyBtn');
  if (apply) apply.addEventListener('click', () => run(rep, 1, true));
  const clear = $('clearBtn');
  if (clear) clear.addEventListener('click', () => {
    (rep.params || []).forEach(p => {
      const el = $('f-' + p.name);
      if (!el) return;
      // A dropdown clears to its "همه" entry -- the empty option it genuinely
      // has -- and not to a value it has no option for, which would leave the
      // control showing whatever happened to be first.
      // A required one has no such entry, and goes back to its default.
      if (el.tagName === 'SELECT') { el.value = p.required ? (p.default || '') : ''; return; }
      // Everything else clears to the value the report DECLARES, not to blank.
      //
      // Blank is not "no filter" on the way in: Bind substitutes the declared
      // default for a value that is absent or empty, so clearing a report's
      // dates put two empty boxes on screen and still queried the declared
      // range -- and filterSummary, which reads these same
      // fields, then printed "no date filter" across a sheet of bounded rows.
      //
      // The alternative fix -- making blank mean "no filter" in Bind -- is
      // worse for exactly these parameters: the dates are bound into a
      // BETWEEN, and BETWEEN '' AND '' matches nothing. Showing the default is
      // the only state in which the screen and the query agree.
      el.value = p.default || '';
    });
    // The token fields show their value rather than holding it, so restoring
    // the declared default has to repaint them -- and empty the boxes people
    // were typing in, which پاک کردن plainly means.
    chipsSync(rep);
    run(rep, 1, true);
  });
  (rep.params || []).forEach(p => {
    const el = $('f-' + p.name);
    if (!el) return;
    // A multi-value filter is two elements: the hidden field the query reads,
    // and the box the reader types in. Every listener below belongs on the box
    // -- attaching them to a hidden field would be attaching them to something
    // that never sees a keystroke.
    const multi = p.kind === 'anyof';
    const box = multi ? $('f-' + p.name + '-type') : el;
    if (!box) return;

    if (multi) {
      const holder = $('f-' + p.name + '-box');
      const removeTok = e => {
        const x = e.target.closest('.chip-tok .x');
        if (!x) return;
        // Listened for on mousedown as well as click, for the reason the
        // suggestion rows are: a click arrives only after the typing box has
        // lost focus, the blur handler below then commits whatever was in it,
        // and repainting the tokens destroys the very button the click was
        // travelling to -- so the click never lands and the token stays.
        // Keyboard activation produces a click with no mousedown before it, so
        // both are listened for and whichever comes first does the work.
        e.preventDefault();
        if (chipsRemove(p.name, +x.dataset.i)) run(rep, 1, true);
        // Focus must not be left on a button that no longer exists. Only when
        // it is not already in the box: focusing it opens the suggestion list,
        // and removing a token with the pointer should not do that.
        if (document.activeElement !== box) box.focus();
      };
      if (holder) {
        holder.addEventListener('mousedown', removeTok);
        holder.addEventListener('click', removeTok);
      }
      // Backspace in an empty box takes the last token off, which is what a
      // field of tokens has taught everyone to expect.
      box.addEventListener('keydown', e => {
        if (e.key !== 'Backspace' || box.value !== '') return;
        const vals = chipValues(p.name);
        if (!vals.length) return;
        e.preventDefault();
        if (chipsRemove(p.name, vals.length - 1)) run(rep, 1, true);
      });
      // Taken when the box loses focus, so اعمال فیلتر applies what is on
      // screen rather than what was last confirmed. A click on a suggestion
      // row does not reach here -- that handler prevents the default on
      // mousedown, so the field never loses focus.
      box.addEventListener('blur', () => { chipsTake(p.name, box); });
    }

    // The suggestion keyboard is registered first, on purpose. Enter means
    // "take this name" when a row is highlighted and "apply the filter"
    // otherwise, and the only way to keep the second handler from also firing
    // is to be ahead of it and stop it.
    if (p.suggestable) {
      const pick = v => {
        if (multi) {
          // Into the tokens, with the typing box cleared and the list left
          // open so the next name is one click away -- which is the whole
          // point of a filter that takes several. The list is repositioned
          // because a new token can push the box onto another line.
          box.value = '';
          const changed = chipsAdd(p.name, v);
          repositionSugg();
          if (changed) run(rep, 1, true);
          return;
        }
        el.value = v;
        closeSugg();
        run(rep, 1, true);
      };
      let timer = null;
      const ask = () => {
        clearTimeout(timer);
        // Debounced: one request after a pause, not one per keystroke.
        timer = setTimeout(() => loadSuggestions(rep, p.name, box, pick), 180);
      };
      box.addEventListener('input', ask);
      box.addEventListener('focus', ask);   // the common names, before typing
      box.addEventListener('blur', () => {
        // After the pointer has had its chance: a click on a row lands on
        // mousedown, which is before this, but a click on the box's padding
        // or its scrollbar should not close it either.
        setTimeout(() => { if (suggAnchor === box && !openSugg?.matches(':hover')) closeSugg(); }, 120);
      });
      box.addEventListener('keydown', e => {
        if (!openSugg || suggAnchor !== box) {
          // ArrowDown on a quiet field opens the list, which is what the
          // native control did.
          if (e.key === 'ArrowDown') { e.preventDefault(); ask(); }
          return;
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          suggMove(box, e.key === 'ArrowDown' ? 1 : -1);
          return;
        }
        if (e.key === 'Enter' && suggAt >= 0) {
          e.preventDefault();
          // Stops the generic Enter handler below from also running and
          // applying the filter with the old value still in the field.
          e.stopImmediatePropagation();
          pick(suggValues[suggAt]);
          return;
        }
        if (e.key === 'Escape') {
          // Swallowed, so Escape closes the list without also reaching the
          // document handler that closes the date picker.
          e.stopPropagation();
          closeSugg();
        }
      });
    }

    // Enter in any filter box applies, which is what everyone tries first. On a
    // token field it has to take what is in the box first: the value the query
    // reads is the token list, and text still being typed is not in it yet.
    box.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (multi) chipsTake(p.name, box);
      run(rep, 1, true);
    });
    // A control with no "done typing" moment runs on change. That is a
    // dropdown, and it is also a date field: the box is readonly and the
    // calendar is the only way to set it, so choosing a day IS the whole
    // interaction.
    //
    // The date half was missing, and the effect was not a missing convenience
    // but a wrong page: showPicker dispatches a synthetic change when a day is
    // chosen and nothing was listening for it, so the box read the date the
    // reader had just picked while the table under it still described the old
    // range, until somebody thought to press اعمال فیلتر.
    //
    // No double-run risk. The field is readonly, so the browser never fires a
    // native change on it; the only change events are the picker's, and none of
    // the paths that set these fields in code (clearBtn, filterByMonth,
    // filterByChartLabel) dispatch one -- they call run themselves.
    if (el.tagName === 'SELECT' || p.kind === 'date') {
      el.addEventListener('change', () => run(rep, 1, true));
    }

    if (p.kind === 'date') {
      // The field is read-only so the calendar is the only way to set it --
      // these formats are exact, and a typo produces an empty report rather
      // than an error.
      el.addEventListener('click', ev => { ev.stopPropagation(); showPicker(el); });
      el.addEventListener('focus', () => showPicker(el));
    }

  });
  $('refreshBtn').addEventListener('click', () => run(rep, 1, true));
  // No PDF export on a report page, by request.
  //
  // A report page shows one page of rows at a time, so the sheet could only
  // ever carry those hundred while looking like the whole report -- which is
  // the kind of document somebody takes into a meeting. خروجی CSV is beside
  // this and exports the whole filtered result rather than the page, so the
  // capability is not lost, only the misleading shape of it.
  $('exportBtn').addEventListener('click', () => {
    const q = new URLSearchParams(Object.assign({ id: rep.id }, collectParams(rep)));
    // A normal navigation, so the browser saves the file and the session
    // cookie goes with the request.
    location.href = '/api/reports/export?' + q.toString();
  });

  // A token field renders empty and shows its selection from script, so a
  // report that declares a default for one has to paint it before the first
  // run -- otherwise the query is filtered by a value nothing on screen says.
  chipsSync(rep);

  // run() starts the findings too, without awaiting them: they are a second
  // query and the table must not wait behind them.
  run(rep, 1, true);
}

// A few grey bars standing in for the table that is coming.
function skeleton(n) {
  return '<div class="skel">' + Array.from({ length: n },
    (_, i) => '<i style="width:' + (98 - (i % 4) * 11) + '%"></i>').join('') + '</div>';
}

// run fetches one page of the table, and optionally rebuilds the chart.
//
// withChart is false when only the page changed: the chart summarises the whole
// filtered result, so paging through the table does not alter it, and
// re-running the aggregate would be a second full scan for an identical
// picture.
async function run(rep, page, withChart) {
  const st = state[rep.id] || (state[rep.id] = { page: 1 });
  st.page = page || st.page;
  const body = $('body');
  if (!body) return;
  const params = collectParams(rep);

  body.innerHTML = skeleton(7);
  // The chart is a second, independent request. Fired together with the table
  // rather than after it, so the slower of the two sets the wait instead of
  // the two adding up -- and a chart that fails still leaves a usable table.
  if (rep.chart && withChart) loadChart(rep, params);
  if ((rep.monthly_column || rep.monthly_why_not) && withChart) loadMonthly(rep, params);

  try {
    // Wrapped in busy(), which reveals the loading animation only if the wait
    // passes 300ms. A report usually answers in single-digit milliseconds and
    // the skeleton above covers it, so nothing appears.
    const r = await busy(api('/api/reports/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: rep.id, params, page: st.page, per_page: 100 }),
    }));
    const d = await r.json();
    if (!r.ok) {
      body.innerHTML = '<div class="err">' + esc(d.error || 'اجرای گزارش ممکن نشد.') + '</div>';
      return;
    }
    render(rep, d);
    noteSource(body, d.data_source);
  } catch (e) {
    if (e.message !== 'unauthenticated') {
      body.innerHTML = '<div class="err">ارتباط با سرور برقرار نشد.</div>';
    }
  }
}

async function loadChart(rep, params) {
  const well = $('chartwell');
  if (!well) return;
  // Each run gets a token; a slow response from a previous filter must not
  // paint over the chart the current one already drew.
  const token = (well.dataset.token = String(Date.now() + Math.random()));
  // Started now, awaited later: the download overlaps the query rather than
  // following it.
  const libPromise = loadChartLib();
  try {
    const r = await api('/api/reports/chart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: rep.id, params }),
    });
    if (well.dataset.token !== token) return;
    const cd = await r.json();
    if (!r.ok || !cd.labels || !cd.labels.length) {
      destroyChart();
      // `problem` is the server declining to draw something misleading -- a
      // sum across mixed currencies, say. That is worth stating plainly
      // rather than showing as a generic empty state.
      const why = cd.problem || (r.ok ? 'داده‌ای برای نمودار وجود ندارد.'
                                      : (cd.error || 'نمودار ساخته نشد.'));
      well.innerHTML = '<div class="note">' + esc(why) + '</div>';
      return;
    }
    // The library and the data were requested together; this waits only for
    // whichever is still outstanding.
    await libPromise;
    if (well.dataset.token !== token) return;
    chartCategory[rep.id] = cd.label || '';
    // A broken-down chart needs room per bar, not per category.
    //
    // Twenty experts is twenty bars, which the fixed 340px box fits; twenty
    // experts in three statuses is sixty, and at five pixels each the
    // completed and cancelled bars were slivers too thin to point at. The box
    // grows with the number of bars actually drawn, and is left alone for
    // every other chart.
    // The box no longer grows with the number of bars.
    //
    // It used to: 15px a bar for a broken-down chart up to 1400px, and 44px a
    // row on a phone up to 1200px. Both were the right answer to "the bars are
    // too thin to point at" and the wrong answer to "I cannot see the chart" --
    // a report page became a column of chart taller than several screens. The
    // stylesheet's fixed height applies instead, and zoomShell below turns the
    // box into a window whose contents step up to four times that, so the room
    // those heights bought is still reachable without moving the page.
    const boxStyle = '';
    well.innerHTML = chartCaption(cd) +
      '<div class="chartbox"' + boxStyle + '><canvas id="chart"></canvas></div>' +
      insightsHTML(cd);
    if (!drawChart(cd)) {
      well.innerHTML = '<div class="note">این نتیجه قابل نمایش به صورت نمودار نیست.</div>';
    }
  } catch (e) {
    if (well.dataset.token !== token) return;
    if (e.message !== 'unauthenticated') {
      well.innerHTML = '<div class="note">نمودار بارگذاری نشد.</div>';
    }
  }
}

// ------------------------------------------------ the monthly summary banner
//
// A headline panel above the table: the total, the month-on-month move, and a
// bar per month. It answers "how are we doing" before the reader has scrolled,
// which a four-thousand-row table cannot.
//
// The figures come from the server over the whole filtered result, not from
// the page of rows on screen -- a monthly total built from fifty visible rows
// would be wrong in a way nobody could see.
let monthlyChart = null;
let compareChart = null;

function destroyMonthly() {
  if (monthlyWatch) { monthlyWatch(); monthlyWatch = null; }
  if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
  if (compareChart) { compareChart.destroy(); compareChart = null; }
}

async function loadMonthly(rep, params) {
  const well = $('monthlywell');
  if (!well) return;
  const token = String(Date.now() + Math.random());
  well.dataset.token = token;
  well.innerHTML = skeleton(1);

  const libPromise = loadChartLib();
  try {
    const r = await api('/api/reports/monthly', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: rep.id, params }),
    });
    if (well.dataset.token !== token) return;
    const m = await r.json();
    const series = r.ok && m.labels && m.labels.length;
    const cmp = r.ok ? m.compare : null;
    // A report with no date column returns a comparison that is not available
    // and says why, and no series at all. It still renders: the reason is the
    // answer to "why is there no chart here", and an empty strip is not.
    if (!series && !cmp) {
      destroyMonthly();
      well.innerHTML = '';
      return;
    }
    await libPromise;
    if (well.dataset.token !== token) return;
    destroyMonthly();
    well.innerHTML = (series ? monthlyHTML(m) : '') + compareHTML(cmp);
    // Both bar charts wait for the same first sight of the banner: it sits
    // right under the filters, so on most screens this fires at once, but a
    // report reached by a bookmark low on the page should not pay for either
    // until the reader has actually scrolled up to them.
    monthlyWatch = lazyChart(well, () => {
      monthlyWatch = null;
      if (series) drawMonthly(m, rep);
      if (cmp && cmp.available) drawCompare(cmp);
    });
  } catch (e) {
    if (well.dataset.token !== token) return;
    if (e.message !== 'unauthenticated') well.innerHTML = '';
  }
}

// The comparison panel: three figures and two years of bars.
//
// Every figure is printed even when its percentage cannot be: "52 this month
// against none last year" is a fact worth reading, and "+∞%" is not a number.
// The percentage is held back in exactly two cases -- a base of zero, and a
// pair of months holding fewer rows than the percentage can bear -- and both
// say so in words instead.
function compareHTML(c) {
  if (!c) return '';
  if (!c.available) {
    return '<section class="cmp glass">' +
      '<div class="cmp-head"><span class="cmp-title">مقایسه دوره‌ای</span></div>' +
      `<p class="cmp-none">${esc(c.reason || '')}</p>` +
    '</section>';
  }

  const card = (k, d, note) => {
    const has = d.has && !d.thin;
    const up = has && d.pct > 0, down = has && d.pct < 0;
    const move = has
      ? `<span class="trend ${up ? 'up' : down ? 'down' : 'flat'}">` +
          `${up ? '▲' : down ? '▼' : '■'} ${faFull.format(Math.abs(Math.round(d.pct)))}٪</span>`
      : '';
    // When the base is zero there is no percentage to print, so the card says
    // what happened instead. Reading "against none" is unambiguous; reading a
    // blank space beside a number is not.
    const why = d.has
      ? (d.thin ? 'تعداد کم است' : '')
      : (d.then > 0 ? '' : 'در دوره قبل چیزی ثبت نشده');
    return '<div class="cmp-card">' +
      `<span class="cmp-k">${esc(k)}</span>` +
      '<span class="cmp-fig">' +
        `<span class="cmp-now">${faFull.format(Math.round(d.now))}</span>` +
        move +
      '</span>' +
      `<span class="cmp-then">${esc(d.label)}: ${faFull.format(Math.round(d.then))}</span>` +
      (why ? `<span class="cmp-note">${esc(why)}</span>` : '') +
      (note ? `<span class="cmp-note">${esc(note)}</span>` : '') +
    '</div>';
  };

  const when = c.partial
    ? `${esc(c.month_label)} تا روز ${faFull.format(c.day)}`
    : esc(c.month_label);

  return '<section class="cmp glass">' +
    '<div class="cmp-head">' +
      '<span class="cmp-title">مقایسه دوره‌ای</span>' +
      `<span class="cmp-when">${when}</span>` +
    '</div>' +
    '<div class="cmp-row">' +
      // The same two names the report builder already offers for these
      // comparisons, so the two places in the app do not invent separate
      // vocabulary for one idea. See chartCompares in customchart.go.
      card('نسبت به ماه گذشته', c.mom) +
      card('ماه با ماه پارسال', c.yoy) +
      card(`امسال تا این ماه در برابر ${c.last_year_label}`, c.year) +
    '</div>' +
    '<div class="cmp-box"><canvas id="compareChart"></canvas></div>' +
    (c.caveats && c.caveats.length
      ? '<ul class="cmp-cav">' +
          c.caveats.map(s => `<li>${esc(s)}</li>`).join('') +
        '</ul>'
      : '') +
  '</section>';
}

function drawCompare(c) {
  const canvas = $('compareChart');
  if (!canvas || !window.Chart) return;
  const muted = CHART_INK, line = cssVarOr('--line', '#33436b');
  const accent = cssVarOr('--accent', '#E5641D');

  compareChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: c.months,
      datasets: [
        {
          // Last year first so it draws behind in the legend order the eye
          // reads: the older year is the baseline, this year is the news.
          label: c.last_year_label,
          data: c.last_year,
          backgroundColor: 'rgb(148 163 184 / .34)',
          borderColor: 'rgb(148 163 184 / .55)',
          borderWidth: 1,
          borderRadius: 5,
          maxBarThickness: 22,
        },
        {
          label: c.this_year_label,
          data: c.this_year,
          backgroundColor: accent,
          borderRadius: 5,
          maxBarThickness: 22,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, resizeDelay: 120,
      animation: reduceMotion ? false : { duration: 480, easing: 'easeOutQuart' },
      layout: { padding: { top: 4, right: 6, bottom: 0, left: 6 } },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          // Above the plot, as every other chart on this page does: the key
          // says which year is which, and it is no use after the chart has
          // been read. The font comes from Chart.defaults, set once when the
          // library loads -- naming a family here would override the Persian
          // face with whatever this line happened to say.
          position: 'top', align: 'end', rtl: true, textDirection: 'rtl',
          labels: { color: CHART_INK, boxWidth: 12, boxHeight: 12,
                    usePointStyle: true, pointStyle: 'rectRounded' },
        },
        tooltip: {
          rtl: true, textDirection: 'rtl',
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${faFull.format(ctx.parsed.y)}`,
          },
        },
      },
      scales: {
        // Reversed, like the monthly bars above it: these months read right to
        // left, and a comparison drawn the other way round would run against
        // the chart it sits under on the same page.
        x: { reverse: true, position: 'bottom',
             grid: { display: false }, border: { color: line },
             ticks: { color: muted, maxRotation: 0, autoSkipPadding: 8,
                      font: { size: 11.5 } } },
        // border.display, not drawBorder: this is Chart.js 4, where drawBorder
        // was removed and is accepted in silence rather than refused.
        y: { position: 'right', beginAtZero: true,
             grid: { color: line, drawTicks: false },
             border: { display: false },
             ticks: { color: muted, precision: 0, padding: 8, maxTicksLimit: 5,
                      font: { size: 11.5 },
                      callback: v => faFull.format(v) } },
      },
    },
  });
}

function monthlyHTML(m) {
  const up = m.has_change && m.change_pct > 0;
  const down = m.has_change && m.change_pct < 0;
  const move = !m.has_change ? '' :
    `<span class="trend ${up ? 'up' : down ? 'down' : 'flat'}">` +
      `${up ? '▲' : down ? '▼' : '■'} ${faFull.format(Math.abs(Math.round(m.change_pct)))}٪` +
    '</span>';
  // A scan that stopped early, or dates that could not be read, must be said
  // out loud -- a banner is the most quoted thing on the page.
  const caveats = [];
  if (m.capped) caveats.push('نمودار از بخشی از داده‌ها ساخته شده است.');
  if (m.skipped) caveats.push(`${faFull.format(m.skipped)} ردیف تاریخ خوانا نداشت.`);

  return '<section class="banner glass glass-lit">' +
    '<div class="banner-grid">' +
      '<div class="banner-lede">' +
        `<span class="banner-kicker">${esc(m.title || 'گزارش ماهانه')}</span>` +
        `<span class="banner-figure">${faFull.format(m.total)}</span>` +
        '<span class="banner-unit">سفارش در ' +
          faFull.format(m.labels.length) + ' ماه</span>' +
        (move ? '<div class="banner-move">' + move +
          '<span class="banner-movetext">نسبت به ماه پیش</span></div>' : '') +
      '</div>' +
      '<div class="banner-stats">' +
        `<div class="bstat"><span class="k">میانگین ماهانه</span>` +
          `<span class="v">${faFull.format(Math.round(m.average))}</span></div>` +
        `<div class="bstat"><span class="k">پرکارترین ماه</span>` +
          `<span class="v">${esc(m.peak)}</span>` +
          `<span class="s">${faFull.format(m.peak_value)} سفارش</span></div>` +
        `<div class="bstat"><span class="k">آخرین ماه</span>` +
          `<span class="v">${faFull.format(m.values[m.values.length - 1])}</span>` +
          `<span class="s">${esc(m.labels[m.labels.length - 1])}</span></div>` +
      '</div>' +
    '</div>' +
    '<div class="bannerbox"><canvas id="monthlyChart"></canvas></div>' +
    (caveats.length ? '<p class="banner-foot">' + esc(caveats.join(' ')) + '</p>' : '') +
  '</section>';
}

function drawMonthly(m, rep) {
  destroyMonthly();
  const canvas = $('monthlyChart');
  if (!canvas) return;
  // White, like every other label drawn on a canvas -- see CHART_INK.
  const muted = CHART_INK, line = cssVarOr('--line', '#33436b');
  const accent = cssVarOr('--accent', '#E5641D'), peakAt = m.values.indexOf(Math.max(...m.values));

  // A vertical gradient per bar, built against the chart area rather than the
  // canvas: before the first layout the area has no height, and a gradient
  // over a zero-height box paints as a flat block.
  const fill = (ctx, from, to) => {
    const area = ctx.chart.chartArea;
    if (!area) return from;
    const g = ctx.chart.ctx.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, from);
    g.addColorStop(1, to);
    return g;
  };

  monthlyChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: m.labels,
      datasets: [{
        label: 'سفارش',
        data: m.values,
        // The busiest month is the one fact people look for, so it is the one
        // thing given full colour; the rest carry the same hue at half
        // strength. Colour is doing work here, not decoration.
        backgroundColor: ctx => ctx.dataIndex === peakAt
          ? fill(ctx, '#fb923c', 'rgba(249,115,22,.30)')
          : fill(ctx, 'rgba(249,115,22,.72)', 'rgba(249,115,22,.10)'),
        hoverBackgroundColor: ctx => fill(ctx, '#fdba74', 'rgba(249,115,22,.35)'),
        borderRadius: { topLeft: 7, topRight: 7, bottomLeft: 2, bottomRight: 2 },
        borderSkipped: false,
        maxBarThickness: 46,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, resizeDelay: 120,
      animation: reduceMotion ? false : { duration: 520, easing: 'easeOutQuart' },
      layout: { padding: { top: 10, right: 6, bottom: 0, left: 6 } },
      // Vertical bars: match on the category axis so the whole column is a
      // hover target, including the empty space above a short bar.
      interaction: { mode: 'index', axis: 'x', intersect: false },
      hover: { mode: 'index', axis: 'x', intersect: false },
      onClick: (evt, items) => {
        if (!items.length || !window.filterByMonth) return;
        window.filterByMonth(m.keys[items[0].index]);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          rtl: true, textDirection: 'rtl',
          backgroundColor: 'rgba(8,13,26,.95)',
          borderColor: line, borderWidth: 1,
          titleColor: CHART_INK, bodyColor: CHART_INK,
          padding: { x: 13, y: 10 }, cornerRadius: 10, displayColors: false,
          titleFont: { size: 12.5, weight: '600' }, bodyFont: { size: 14 },
          callbacks: { label: c => `${faFull.format(c.parsed.y)} سفارش` },
        },
      },
      scales: {
        x: {
          // RTL: months read right to left, newest at the left edge.
          reverse: true, position: 'bottom',
          grid: { display: false }, border: { color: line },
          ticks: {
            color: muted, font: { size: 12.5 }, maxRotation: 0, autoSkipPadding: 12,
            // The year comes off on a narrow chart.
            //
            // Measured on a 390px phone: of five months, only three were
            // painted -- "خرداد ۱۴۰۵" and "مرداد ۱۴۰۵" were silently dropped
            // by autoSkip, because "اردیبهشت ۱۴۰۵" is wide and maxRotation is
            // 0. The year is the same on every visible label, so it is the
            // part carrying no information, and removing it is what makes all
            // five fit. The tooltip still names the month in full.
            callback(v) {
              const raw = this.getLabelForValue(v);
              if (this.chart && this.chart.width >= 520) return raw;
              const sp = raw.lastIndexOf(' ');
              return sp > 0 ? raw.slice(0, sp) : raw;
            },
          },
        },
        y: {
          reverse: false, position: 'right', beginAtZero: true,
          grid: { color: line, drawTicks: false },
          border: { display: false },
          ticks: { color: muted, font: { size: 12 }, padding: 8, maxTicksLimit: 5 },
        },
      },
    },
  });
  canvas.style.cursor = 'pointer';
  void accent;
}

// ------------------------------------------------- sorting and columns
//
// Both are per report and remembered, because the useful arrangement of a
// twenty-column report is a property of that report and of the person reading
// it -- not something to rebuild on every visit. Kept in localStorage rather
// than on the server: it is a display preference, not data, and it should not
// follow somebody to a different machine where the screen is a different size.
const prefsKey = id => 'docfind.table.' + id;

function loadPrefs(id) {
  try { return JSON.parse(localStorage.getItem(prefsKey(id))) || {}; }
  catch (e) { return {}; }        // private windows and cleared storage
}
function savePrefs(id, p) {
  try { localStorage.setItem(prefsKey(id), JSON.stringify(p)); } catch (e) {}
}

// Compares two cells for sorting.
//
// Numbers sort as numbers and everything else with the Persian collator, so
// "ب" lands after "الف" rather than by code point. Blanks always sort last,
// in both directions: an empty cell is missing information, and a column
// sorted ascending that opens with twenty blanks has buried the answer.
const collator = new Intl.Collator('fa', { numeric: true, sensitivity: 'base' });
function compareCells(a, b) {
  const ea = a === null || a === undefined || String(a).trim() === '';
  const eb = b === null || b === undefined || String(b).trim() === '';
  if (ea || eb) return ea && eb ? 0 : (ea ? 1 : -1);
  const na = asNumber(a), nb = asNumber(b);
  if (na !== null && nb !== null) return na - nb;
  return collator.compare(String(a), String(b));
}

// Reads a cell as a number if it plainly is one, including the formatted money
// these views return ("€ 30,744.00").
function asNumber(v) {
  if (typeof v === 'number') return v;
  const s = String(v ?? '').replace(/[\s,٬ ]/g, '')
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/^[€$£¥₽₺﷼]/, '').replace(/(IRR|EUR|USD)$/i, '');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}

// A «جمع» cell, written the way the query writes the amounts above it.
const sumFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });

function render(rep, d) {
  const st = state[rep.id];
  const body = $('body');
  // What actually reached the page, kept for the PDF masthead. Recorded here,
  // at the moment of drawing, rather than worked out from the DOM later: the
  // export must describe the rows that are on the sheet, and reading the table
  // back would describe them only until somebody hides a column.
  if (st) {
    st.shown = d.rows.length;
    st.hasMore = !!d.hasMore;
  }
  if (!d.rows.length) {
    // The .empty component from app.css rather than a bare sentence: a filter
    // that matches nothing is the state a demo hits most often, and an icon
    // with a heading reads as "nothing here" instead of as a failure.
    body.innerHTML = '<div class="empty"><div>' +
      '<svg class="ic" aria-hidden="true"><use href="#i-filter"/></svg>' +
      '<b>ردیفی یافت نشد</b>' +
      'با این فیلترها داده‌ای وجود ندارد؛ بازه زمانی یا فیلترها را تغییر دهید.' +
      '</div></div>' +
      '<div class="pager"><span class="count">۰ ردیف &middot; ' +
      faFull.format(d.tookMs) + ' میلی‌ثانیه</span></div>';
    return;
  }

  const prefs = loadPrefs(rep.id);
  const hidden = new Set(prefs.hidden || []);
  // Never hide the last column: a table with no columns is not a narrower
  // table, it is a broken screen.
  const shown = d.columns.filter(c => !hidden.has(c));
  const cols = shown.length ? shown : d.columns;

  // Sorting applies to the loaded page. Stated in the pager rather than
  // implied, because sorting one page of a paged result is not the same as
  // sorting the report, and a reader who assumes otherwise draws the wrong
  // conclusion from the top row.
  let rowData = d.rows.map((row, i) => ({ row, n: (d.page - 1) * d.perPage + i + 1 }));
  const sortIdx = prefs.sort ? d.columns.indexOf(prefs.sort) : -1;
  if (sortIdx >= 0) {
    const dir = prefs.dir === 'desc' ? -1 : 1;
    rowData = rowData.slice().sort((a, b) => dir * compareCells(a.row[sortIdx], b.row[sortIdx]));
  }

  // Every sortable column carries an icon, not just the active one. A control
  // that only appears once you have already used it cannot be discovered:
  // the dimmed double chevron says "this sorts", and it sharpens into a single
  // arrow showing the direction once it does.
  const arrow = c => {
    if (prefs.sort !== c) return '<span class="sortmark idle" aria-hidden="true">⇅</span>';
    return `<span class="sortmark on" aria-hidden="true">${prefs.dir === 'desc' ? '↓' : '↑'}</span>`;
  };
  const sortState = c => prefs.sort !== c ? 'none' : (prefs.dir === 'desc' ? 'descending' : 'ascending');
  const head = '<tr><th class="rownum">#</th>' + cols.map(c => {
    const label = esc((d.labels && d.labels[c]) || c);
    return `<th aria-sort="${sortState(c)}">` +
      `<button type="button" class="sortbtn" data-col="${esc(c)}" title="مرتب‌سازی بر پایه ${label}">` +
      `<span class="lbl">${label}</span>${arrow(c)}</button></th>`;
  }).join('') + '</tr>';

  const idx = cols.map(c => d.columns.indexOf(c));

  const rows = rowData.map(({ row, n }) =>
    '<tr>' +
      '<td class="rownum">' + faFull.format(n) + '</td>' +
      idx.map(i => {
        const v = row[i];
        // The value goes inside a wrapper so the stylesheet can cap how many
        // lines it wraps onto: a line clamp needs display:-webkit-box, and a
        // <td> carrying that leaves the table layout and the columns collapse.
        // The title stays, and now earns its place -- it is the whole value
        // for a cell the clamp has shortened, rather than a tooltip repeating
        // text already fully visible.
        return '<td' + (looksNumeric(v) ? ' class="num"' : '') +
          ' title="' + esc(v) + '"><span class="cw">' + esc(v) + '</span></td>';
      }).join('') + '</tr>').join('');

  // «جمع»: the columns the report names with "-- total:", added up over the
  // rows on screen. A foot row rather than a row from the query, so sorting
  // leaves it at the bottom, the numbering skips it and the chart never draws
  // it as one more bar. On a paged result it says it is this page's total.
  // Written in the cells' own style -- Latin digits with thousands commas.
  // On a result of more than one page the server sends every row's total
  // (reporttotals.go), shown as «جمع کل»; without it, this page's.
  const totals = new Set((rep.total_columns || []).map(c => String(c).toLowerCase()));
  let foot = '';
  if (cols.some(c => totals.has(c.toLowerCase()))) {
    const whole = d.totals && typeof d.totals === 'object' ? d.totals : null;
    const sums = cols.map((c, k) => !totals.has(c.toLowerCase()) ? null
      : whole && whole[c.toLowerCase()] != null ? String(whole[c.toLowerCase()])
      : sumFmt.format(Math.round(rowData.reduce((s, { row }) => s + (asNumber(row[idx[k]]) || 0), 0))));
    const label = '<b>' + (whole ? 'جمع کل' : d.hasMore || d.page > 1 ? 'جمع همین صفحه' : 'جمع') + '</b>';
    const at = sums.findIndex(s => s === null);
    foot = '<tfoot><tr class="sumrow"><td class="rownum">' + (at < 0 ? label : '') + '</td>' +
      sums.map((s, k) => s !== null
        ? '<td class="num"><span class="cw">' + esc(s) + '</span></td>'
        : '<td>' + (k === at ? label : '') + '</td>').join('') +
      '</tr></tfoot>';
  }

  const hiddenNote = hidden.size
    ? `<span class="count" style="margin:0">${faFull.format(hidden.size)} ستون پنهان</span>` : '';

  body.innerHTML =
    '<div class="tablebar">' +
      '<button class="btn btn-sm" id="colsBtn" aria-expanded="false">ستون‌ها</button>' +
      (sortIdx >= 0 ? '<button class="btn btn-sm" id="unsortBtn">حذف مرتب‌سازی</button>' : '') +
      hiddenNote +
    '</div>' +
    '<div class="scroll"><table class="data"><thead>' + head + '</thead><tbody>' + rows + '</tbody>' + foot + '</table></div>' +
    '<div class="pager">' +
      '<button class="btn" id="prevBtn"' + (st.page <= 1 ? ' disabled' : '') + '>قبلی</button>' +
      '<button class="btn" id="nextBtn"' + (d.hasMore ? '' : ' disabled') + '>بعدی</button>' +
      '<span class="count">صفحه ' + faFull.format(d.page) + ' &middot; ' +
        faFull.format(d.rows.length) + ' ردیف &middot; ' +
        faFull.format(d.tookMs) + ' میلی‌ثانیه' +
        (sortIdx >= 0 ? ' &middot; مرتب‌سازی روی همین صفحه' : '') +
      '</span>' +
    '</div>';

  $('prevBtn').addEventListener('click', () => run(rep, st.page - 1, false));
  $('nextBtn').addEventListener('click', () => run(rep, st.page + 1, false));

  // Three states, cycling: ascending, descending, none. The third matters --
  // without it there is no way back to the order the query produced, which is
  // meaningful for reports that already ORDER BY.
  body.querySelectorAll('.sortbtn').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.col;
    const p = loadPrefs(rep.id);
    if (p.sort !== c) { p.sort = c; p.dir = 'asc'; }
    else if (p.dir === 'asc') { p.dir = 'desc'; }
    else { delete p.sort; delete p.dir; }
    savePrefs(rep.id, p);
    render(rep, d);                     // re-render from data already loaded
  }));

  const unsort = $('unsortBtn');
  if (unsort) unsort.addEventListener('click', () => {
    const p = loadPrefs(rep.id);
    delete p.sort; delete p.dir;
    savePrefs(rep.id, p);
    render(rep, d);
  });

  $('colsBtn').addEventListener('click', e => {
    e.stopPropagation();
    toggleColumnMenu(rep, d, hidden);
  });
}

// The column picker. A plain list of checkboxes: twenty columns is too many
// for a row of chips, and the point is to scan names and tick a few.
function toggleColumnMenu(rep, d, hidden) {
  const open = document.querySelector('.colmenu');
  if (open) { open.remove(); $('colsBtn').setAttribute('aria-expanded', 'false'); return; }

  const menu = document.createElement('div');
  menu.className = 'colmenu';
  menu.innerHTML =
    '<div class="colmenu-head">ستون‌های نمایش داده شده</div>' +
    d.columns.map(c =>
      `<label><input type="checkbox" data-col="${esc(c)}"${hidden.has(c) ? '' : ' checked'}>` +
      `<span>${esc((d.labels && d.labels[c]) || c)}</span></label>`).join('') +
    '<div class="colmenu-foot"><button type="button" class="btn btn-sm" data-all>نمایش همه</button></div>';

  menu.addEventListener('click', e => e.stopPropagation());
  menu.querySelectorAll('input[data-col]').forEach(cb => cb.addEventListener('change', () => {
    const p = loadPrefs(rep.id);
    const set = new Set(p.hidden || []);
    if (cb.checked) set.delete(cb.dataset.col); else set.add(cb.dataset.col);
    // Refuse to hide the last one, and say so by putting the tick back.
    if (set.size >= d.columns.length) { cb.checked = true; return; }
    p.hidden = [...set];
    savePrefs(rep.id, p);
    render(rep, d);
  }));
  menu.querySelector('[data-all]').addEventListener('click', () => {
    const p = loadPrefs(rep.id);
    delete p.hidden;
    savePrefs(rep.id, p);
    render(rep, d);
  });

  $('colsBtn').setAttribute('aria-expanded', 'true');
  $('colsBtn').parentElement.appendChild(menu);
  document.addEventListener('click', function close() {
    menu.remove();
    const b = $('colsBtn');
    if (b) b.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', close);
  }, { once: true });
}

// Hash routing, so the browser's own Back button returns to the list and a
// single report can be linked to directly.
function route() {
  const id = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
  if (id) showReport(id);
  else if (id) showReport(id);
  else showList();
}

async function init() {
  try {
    const meta = await (await api('/api/me')).json();
    if (meta.auth_enabled && !meta.user) { location.replace('/login?next=/dashboard'); return; }
    me = meta.user;
    // The account carries the display preferences; the copy applied before
    // paint came from this browser's cache, so reconcile them here.
    if (window.docfindPrefs) window.docfindPrefs.write((me && me.prefs) || null);
    if (me) $('who').textContent = me.display_name || me.username;
    buildNav({
      admin: !!me && me.role === 'admin',
      user: me ? (me.display_name || me.username) : null,
      account: me,
      onSignOut: () => fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
        .finally(() => location.replace('/login')),
    });
    // The settings link is admin-only; buildNav was told the role above and
    // leaves it out for everybody else. The page and the API check again.
  } catch (e) { return; }

  let list;
  try { list = await (await api('/api/reports')).json(); } catch (e) { return; }
  // No shipped reports: the list says how to add them, and still offers the
  // builder to whoever holds it.
  unconfigured = !list.enabled;
  catalogue = list.reports || [];
  route();
}

$('signout').addEventListener('click', () => {
  fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
    .finally(() => location.replace('/login'));
});

// The worker is registered by nav.js, which every page in the app loads.
init();
</script>
</body>
</html>
