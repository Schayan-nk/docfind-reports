    kind === 'polar' ? 'polarArea' :
    kind === 'radar' ? 'radar' :
    kind === 'scatter' ? 'scatter' :
    round ? kind :
    (kind === 'line' || kind === 'area') ? 'line' :
    'bar';

  const colour = i => CHART_COLOURS[i % CHART_COLOURS.length];
  const fade = (i, a) => {
    const c = colour(i);
    const n = parseInt(c.slice(1), 16);
    return `rgb(${(n >> 16) & 255} ${(n >> 8) & 255} ${n & 255} / ${a})`;
  };

  const datasets = d.series.map((s, i) => {
    const base = { label: s.name, data: s.data };
    if (round) {
      // One colour per slice, not per series: the categories are what differ.
      return { ...base,
        backgroundColor: d.labels.map((_, j) => fade(j, kind === 'polar' ? .72 : .92)),
        borderColor: 'rgba(0,0,0,.28)', borderWidth: 1 };
    }
    if (kind === 'radar') {
      return { ...base, backgroundColor: fade(i, .22), borderColor: colour(i),
        borderWidth: 2, pointBackgroundColor: colour(i) };
    }
    if (kind === 'scatter') {
      return { ...base, backgroundColor: fade(i, .7), borderColor: colour(i),
        pointRadius: small ? 2 : 4, pointHoverRadius: small ? 3 : 6 };
    }
    if (kind === 'line' || kind === 'area') {
      return { ...base, borderColor: colour(i), borderWidth: 2,
        backgroundColor: fade(i, .22), fill: kind === 'area',
        tension: 0.25, pointRadius: small ? 0 : 3 };
    }
    // A mixed chart is the reason datasets carry their own type: the first
    // column is bars and the rest ride over it as a line, which is how two
    // measures with different units share one picture.
    if (kind === 'mixed' && i > 0) {
      return { ...base, type: 'line', borderColor: colour(i), borderWidth: 2,
        backgroundColor: fade(i, .2), tension: 0.25, pointRadius: small ? 0 : 3,
        fill: false, order: 0 };
    }
    return { ...base, backgroundColor: fade(i, .92), borderColor: colour(i),
      borderWidth: 0, order: 1 };
  });

  const stacked = kind === 'sbar' || (info.stackable && !!spec.stacked);
  const valueAxis = {
    stacked,
    beginAtZero: !spec.log_scale,
    // A logarithmic axis cannot start at zero and cannot show one: this data
    // spans 10.45 to 52,689, which is exactly when it earns its place.
    type: spec.log_scale ? 'logarithmic' : 'linear',
    max: kind === 'sbar' ? 100 : undefined,
    ticks: small ? { display: false } : {
      callback: v => kind === 'sbar' ? v + '٪' : v,
    },
    grid: { display: !small },
  };
  const categoryAxis = {
    stacked,
    type: kind === 'scatter' ? 'linear' : 'category',
    ticks: small ? { display: false } : { autoSkip: true, maxRotation: 0 },
    grid: { display: !small && kind === 'scatter' },
  };

  let scales;
  if (sliced) {
    scales = {};
  } else if (radial) {
    scales = { r: {
      beginAtZero: true,
      ticks: { display: !small },
      grid: { display: !small },
      // pointLabels are NOT ticks and are not hidden by hiding them -- a
      // radar preview came out with three Persian category names bigger than
      // the shape they were labelling.
      pointLabels: { display: !small },
      angleLines: { display: !small },
    } };
  } else if (kind === 'hbar') {
    // The index axis is swapped, so the categories are on y and the values
    // on x -- and the stacking flag has to travel with them.
    scales = { y: categoryAxis, x: valueAxis };
  } else {
    scales = { x: categoryAxis, y: valueAxis };
  }

  return {
    type,
    data: { labels: d.labels, datasets },
    options: {
      // The window has a fixed height and the canvas fills it, so Chart.js
      // must not also try to keep a ratio -- that is what made it fight the
      // box and oscillate on the reports page.
      responsive: true, maintainAspectRatio: false,
      animation: small ? false : undefined,
      indexAxis: kind === 'hbar' ? 'y' : 'x',
      // A gallery tile is decoration for a button; the real chart is the one
      // people interrogate.
      events: small ? [] : undefined,
      plugins: {
        // Above the chart, matching the reports page.
        legend: {
          display: !small && (round || d.series.length > 1),
          position: 'top',
        },
        title: (!small && spec.title) ? { display: true, text: spec.title } : { display: false },
        tooltip: small ? { enabled: false } : {
          callbacks: kind === 'sbar' ? {
            label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(1)}٪`,
          } : undefined,
        },
      },
      scales,
    },
  };
}

// drawInto draws one chart, replacing whatever was there.
function drawInto(canvas, d, spec, existing) {
  if (existing) existing.destroy();
  return new Chart(canvas, chartConfig(d, spec, false));
}

// ------------------------------------------------------- chart gallery

// The preview charts, held so they can be destroyed before the tiles they
// live in are replaced. A canvas whose Chart is still registered cannot be
// reused, and the gallery is rebuilt on every run.
let galleryCharts = [];

function destroyGallery() {
  for (const c of galleryCharts) { try { c.destroy(); } catch (e) {} }
  galleryCharts = [];
}

// renderGallery draws one tile per chart type from the current result.
async function renderGallery() {
  const box = $('chartGallery');
  destroyGallery();
  const res = LAST_RESULT;
  if (!res || !res.rows || !res.rows.length || !CHART_KINDS.length) {
    box.innerHTML = '';
    $('chartRec').textContent = '';
    return;
  }

  const prof = profileColumns(res);
  // Each tile's spec: the columns this kind would use for this result, or the
  // reason it cannot be drawn.
  const tiles = CHART_KINDS.map(k => ({ k, spec: specFor(k.id, prof, '') }));
  const rec = recommend(prof);

  box.innerHTML = tiles.map(({ k, spec }) => {
    const on = CHART && CHART.kind === k.id;
    const off = !!spec.no;
    return `<div class="gtile${on ? ' on' : ''}${off ? ' off' : ''}"
      data-kind="${esc(k.id)}" ${off ? '' : 'role="button" tabindex="0"'}
      title="${esc(k.hint || '')}">
      ${rec && rec.kind === k.id && !off ? '<span class="gstar" title="پیشنهاد">★</span>' : ''}
      ${off ? `<div class="gwhy">${esc(spec.no)}</div>`
            : '<div class="gcv"><canvas></canvas></div>'}
      <span class="gname">${esc(k.label)}</span>
    </div>`;
  }).join('');

  $('chartRec').innerHTML = rec
    ? `پیشنهاد برای این داده: <b>${esc((chartKindOf(rec.kind) || {}).label || rec.kind)}</b>؛ ${esc(rec.why)}. ` +
      'روی هر کاشی بزنید تا همان نمودار ساخته شود.'
    : 'برای این نتیجه نموداری پیشنهاد نمی‌شود؛ ستون دسته یا عدد لازم است.';

  try { await loadChartLib(); } catch (e) { return; }

  // Drawn after the markup exists, so each canvas is in the document and has
  // a size to be responsive to.
  box.querySelectorAll('.gtile:not(.off)').forEach(tile => {
    const kind = tile.dataset.kind;
    const spec = (tiles.find(t => t.k.id === kind) || {}).spec;
    const canvas = tile.querySelector('canvas');
    if (!spec || !canvas) return;
    try {
      const d = chartData(LAST_RESULT, spec);
      const nothing = d.points ? !d.series.some(s => s.data.length) : !d.labels.length;
      if (d.missing.length || nothing || d.noNumbers) { tile.classList.add('off'); return; }
      galleryCharts.push(new Chart(canvas, chartConfig(d, spec, true)));
    } catch (e) {
      // A type that will not draw is marked so rather than left as an empty
      // box: a blank tile reads as "this chart shows nothing", which is a
      // different and wrong message.
      tile.classList.add('off');
    }
  });
}

// pickKind adopts a type from the gallery, with the columns that type needs.
//
// Filling the columns in is the point. Choosing "scatter" and then being asked
// which two of eleven columns to plot is the same work as before with an extra
// step; choosing it and seeing the scatter it was previewing is the feature.
// The title is kept, because somebody who named their chart did not mean that
// name to belong to only one type.
async function pickKind(kind) {
  const prof = profileColumns(LAST_RESULT);
  const spec = specFor(kind, prof, CHART ? CHART.title : '');
  if (spec.no) { toast(spec.no, 'bad'); return; }
  CHART = spec;
  renderChartEditor();
  await drawChart();
  await renderGallery();
}

// noChart takes the chart off screen and takes its notes with it.
//
// The notes are the reason this exists. Every one of them describes THIS
// chart -- values that could not be read, points a log axis dropped, a
// comparison that could not be drawn -- so a note left standing after the
// chart is gone describes a chart the reader can no longer see. Measured: a
// query whose column name was wrong left "this date column has no day in it"
// on screen, about a query that no longer existed.
function noChart() {
  $('chartBox').hidden = true;
  if (chartObj) { chartObj.destroy(); chartObj = null; }
  const warn = $('chartWarn');
  warn.hidden = true;
  warn.textContent = '';
  $('chartFoot').textContent = '';
}

async function drawChart() {
  if (!CHART || !LAST_RESULT || !LAST_RESULT.rows.length) {
    noChart();
    return;
  }
  const box = $('chartBox');
  const d = chartData(LAST_RESULT, CHART);
  // Nothing to draw, for any of three reasons -- and a column of pure text is
  // one of them. It folds to a row of zeroes, which draws as flat bars and
  // reads as "everything is nought" rather than "this column holds no
  // numbers", so it is refused rather than drawn.
  const nothing = d.points ? !d.series.some(s => s.data.length) : !d.labels.length;
  if (d.missing.length || nothing || d.noNumbers) {
    noChart();
    // Said in the settings panel rather than where the chart would have been:
    // the fix is a column choice, so the message belongs beside the chooser.
    $('chartState').textContent = d.missing.length
      ? 'این ستون‌ها در نتیجه نیستند: ' + d.missing.join('، ')
      : ((d.noNumbers || d.unreadable)
        ? 'هیچ مقدار عددی در این ستون خوانده نشد؛ ستون عددی دیگری انتخاب کنید ' +
          'یا جمع‌بندی را روی «تعداد ردیف» بگذارید.'
        : '');
    return;
  }
  $('chartState').textContent = '';

  try { await loadChartLib(); }
  catch (e) { noChart(); toast('کتابخانهٔ نمودار بار نشد.', 'bad'); return; }

  box.hidden = false;
  chartObj = drawInto($('chartCanvas'), d, CHART, chartObj);

  // What the chart covers, always stated. It is drawn from the rows on this
  // page, not from the whole result, and a reader who assumes otherwise draws
  // the wrong conclusion from a correct picture.
  const agg = chartAggOf(CHART.agg);
  const kindInfo = chartKindOf(CHART.kind) || {};
  const covered = d.points
    ? `${faNum.format(d.series[0].data.length)} نقطه از ${faNum.format(d.rows)} ردیفِ این صفحه`
    : (d.distribution
      ? `${faNum.format(d.labels.length)} بازه از ${faNum.format(d.rows)} ردیفِ این صفحه`
      : `${faNum.format(d.labels.length)} دسته از ${faNum.format(d.rows)} ردیفِ این صفحه`);
  $('chartFoot').textContent =
    (kindInfo.no_agg || !agg ? '' : agg.label + '؛ ') + covered +
    // WHICH periods are being compared, named. A comparison chart whose legend
    // reads "1404" and "1405" is only trustworthy if the reader can see that
    // those are the two the data actually held -- a query covering half of
    // 1405 compares a full year against a partial one, and the footer is where
    // that becomes visible.
    (d.compared ? '، مقایسهٔ ' + d.compared.map(faDigits).join(' و ') : '') +
    (d.percent ? '، بر حسب درصد' : '') +
    (CHART.log_scale ? '، محور لگاریتمی' : '') +
    (LAST_RESULT.has_more ? '. نتیجه ردیف‌های بیشتری هم دارد؛ برای نمودار کل داده، ' +
      'GROUP BY را در پرس‌وجو بنویسید.' : '.');

  // Everything the chart is NOT showing, in one place.
  //
  // Both of these are silent losses if they are not said out loud: a value
  // that could not be read is absent from a chart that otherwise looks
  // complete, and a logarithmic axis simply omits anything at or below nought
  // without adjusting its own scale to admit it.
  const notes = [];
  if (d.unreadable) {
    notes.push(faNum.format(d.unreadable) +
      ' مقدار عددی خوانده نشد و در نمودار نیامد؛ این ستون‌ها در پایگاه داده متن‌اند ' +
      'و ممکن است واحد یا حرف داشته باشند.');
  }
  if (CHART.log_scale) {
    const np = countNonPositive(d);
    if (np) {
      notes.push(faNum.format(np) +
        ' مقدار صفر یا منفی است و روی محور لگاریتمی رسم نمی‌شود؛ ' +
        'برای دیدن همهٔ مقدارها «محور لگاریتمی» را بردارید.');
    }
  }
  if (d.single) {
    notes.push('همهٔ مقدارها یکی است، پس توزیع یک بازه دارد.');
  }
  // A comparison that was asked for and could not be drawn.
  //
  // The chart still draws -- as the one continuous line it was before -- which
  // is why this has to be said. Otherwise the reader set a comparison, got a
  // picture, and has no way to know it is not the picture they asked for.
  if (d.compareNote) {
    notes.push('مقایسهٔ دوره‌ها انجام نشد: ' + d.compareNote);
  }
  const warn = $('chartWarn');
  warn.hidden = notes.length === 0;
  warn.textContent = notes.join(' ');
}

// renderChartEditor draws the column choosers from the result's own columns.
function renderChartEditor() {
  const wrap = $('chartWrap');
  const res = LAST_RESULT;
  wrap.hidden = !res || !res.columns || !res.columns.length;
  if (wrap.hidden) { $('chartRow').innerHTML = ''; return; }

  // The type is chosen from the gallery above, not from a dropdown here, so
  // this row is only the details of the type already chosen. Which details
  // exist depends on the type, and the flags that decide come from the server
  // -- the same ones CleanChart validates against, so a control that appears
  // is a control that saves.
  const c = CHART;
  if (!c || !c.kind) {
    $('chartRow').innerHTML = '';
    $('chartHint').textContent =
      'روی یکی از کاشی‌های بالا بزنید. هر کاشی با داده‌های همین نتیجه کشیده شده است.';
    return;
  }

  const opt = (v, sel, text) =>
    `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(text ?? v)}</option>`;
  const kind = chartKindOf(c.kind) || {};
  const counting = c.agg === 'count';

  // A distribution has no category column and nothing to aggregate: it asks
  // one question of one column. Showing the other controls greyed would imply
  // they are relevant.
  const parts = [];
  if (kind.bins) {
    parts.push(`<label>ستون عددی
      <select class="select" id="cValues">
        ${columnOptions(res, (c.values || [])[0] || '', 'انتخاب کنید…')}
      </select>
    </label>`);
    parts.push(`<label>تعداد بازه‌ها
      <input class="input" id="cBins" type="number" min="3" max="60"
             value="${c.bins || 12}">
    </label>`);
  } else {
    parts.push(`<label>${kind.numeric_label ? 'محور افقی (عدد)' : 'ستون دسته‌ها'}
      <select class="select" id="cLabel">
        ${columnOptions(res, c.label, 'انتخاب کنید…')}
      </select>
    </label>`);

    if (!kind.no_agg) {
      parts.push(`<label>جمع‌بندی ردیف‌های هم‌دسته
        <select class="select" id="cAgg">
          ${CHART_AGGS.filter(a => !(kind.min_values > 1 && a.id === 'count'))
            .map(a => opt(a.id, c.agg, a.label)).join('')}
        </select>
      </label>`);
      parts.push(`<label>گروه‌بندی تاریخ‌ها
        <select class="select" id="cBucket">
          ${CHART_BUCKETS.map(b => opt(b.id, c.bucket || '', b.label)).join('')}
        </select>
      </label>`);
      // Only the comparisons THIS grouping can actually draw.
      //
      // Each mode needs the grouping that leaves its axis in the label --
      // year-on-year needs months, month-on-month needs days -- so offering
      // both under one grouping would put a mode in the list that saves and
      // then never draws. Filtered rather than shown-and-refused: the reader
      // never sees a choice that cannot work.
      const fits = CHART_COMPARES.filter(x => !x.id || x.needs_bucket === c.bucket);
      if (fits.length > 1) {
        parts.push(`<label>مقایسهٔ دوره‌ها
          <select class="select" id="cCompare">
            ${fits.map(x => opt(x.id, c.compare || '', x.label)).join('')}
          </select>
        </label>`);
      }
    }

    if (!counting) {
      const one = kind.single || kind.numeric_label;
      parts.push(`<label>${kind.numeric_label ? 'محور عمودی (عدد)' : 'ستون‌های مقدار'}${
          one ? '' : ' (با Ctrl چندتا)'}
        <select class="select" id="cValues" ${one ? '' : 'multiple'}>
          ${one ? columnOptions(res, (c.values || [])[0] || '', 'انتخاب کنید…')
                : res.columns.map((x, i) => x === c.label ? '' : (() => {
                    const head = headingFor(res, i);
                    const shown = head === x ? x : head + ' (' + x + ')';
                    return `<option value="${esc(x)}"${(c.values || []).includes(x) ? ' selected' : ''}>${esc(shown)}</option>`;
                  })()).join('')}
        </select>
      </label>`);
    }
  }

  parts.push(`<label>عنوان نمودار (اختیاری)
    <input class="input" id="cTitle" maxlength="120" value="${esc(c.title || '')}">
  </label>`);

  if (kind.stackable && !counting) {
    parts.push(`<label style="align-self:center">
      <input type="checkbox" id="cStacked"${c.stacked ? ' checked' : ''}> روی هم (انباشته)
    </label>`);
  }
  // Offered on every kind that HAS a value axis, because this data needs it:
  // the weights run from 10.45 to 52,689 and on a linear axis the small ones
  // are a flat line along the bottom.
  //
  // Not on a pie or doughnut, which have no axis to make logarithmic, nor on
  // a percentage chart, whose axis is already fixed at nought to a hundred.
  if (c.kind !== 'pie' && c.kind !== 'doughnut' && c.kind !== 'sbar') {
    parts.push(`<label style="align-self:center">
      <input type="checkbox" id="cLog"${c.log_scale ? ' checked' : ''}> محور لگاریتمی
    </label>`);
  }

  $('chartRow').innerHTML = parts.join('');

  const bucket = CHART_BUCKETS.find(b => b.id === (c.bucket || ''));
  const cmp = CHART_COMPARES.find(x => x.id === (c.compare || ''));
  $('chartHint').textContent = [
    kind.hint,
    !kind.no_agg && chartAggOf(c.agg) && chartAggOf(c.agg).hint,
    c.bucket && bucket && bucket.hint,
    c.compare && cmp && cmp.hint,
  ].filter(Boolean).join(' ');
}

// readChart pulls the chart settings back out of the form.
function readChart() {
  if (!CHART || !CHART.kind) { CHART = null; return null; }
  const kind = chartKindOf(CHART.kind) || {};
  const vals = $('cValues');
  const label = $('cLabel') ? $('cLabel').value : (kind.bins ? '' : CHART.label);
  const bins = $('cBins');

  CHART = {
    kind: CHART.kind,
    label,
    agg: $('cAgg') ? $('cAgg').value : (kind.no_agg ? 'none' : CHART.agg || 'sum'),
    bucket: $('cBucket') ? $('cBucket').value : '',
    compare: $('cCompare') ? $('cCompare').value : '',
    values: (!vals ? (CHART.values || [])
      : (vals.multiple ? [...vals.selectedOptions].map(o => o.value)
                       : (vals.value ? [vals.value] : [])))
      // The list on screen excludes the label column, but a selection made
      // before the label changed can still name it -- and saving that would
      // be refused for plotting a column against itself.
      .filter(v => v && v !== label),
    stacked: !!($('cStacked') && $('cStacked').checked),
    log_scale: !!($('cLog') && $('cLog').checked),
    bins: bins ? (parseInt(bins.value, 10) || 12) : (CHART.bins || 0),
    title: $('cTitle') ? $('cTitle').value.trim() : (CHART.title || ''),
  };

  // A comparison is dropped unless the grouping now in force is the one it
  // needs, checked HERE rather than left to whether its control is on screen.
  //
  // Changing the grouping fires this before the row is rebuilt, so at this
  // moment the old comparison is still in the DOM: switching from months to
  // days would otherwise carry a year-on-year comparison onto day-grouped
  // labels, where every day of a month lands on the same position and all but
  // one is silently overwritten. A drawn chart, a wrong chart, and nothing
  // said -- so the rule is enforced on the value, not on the control.
  if (CHART.compare) {
    const mode = CHART_COMPARES.find(x => x.id === CHART.compare);
    if (!mode || mode.needs_bucket !== CHART.bucket) CHART.compare = '';
  }
  return CHART;
}

// --------------------------------------------------------------- columns

// COLUMNS is what this report calls its columns, and which it hides. Only the
// ones it has something to say about -- everything else keeps the name the
// query gave it.
let COLUMNS = [];
// COLSUGGEST is what the server says each column of the last result will be
// called, and where that name came from.
let COLSUGGEST = [];

const colSpecFor = name =>
  COLUMNS.find(c => c.name.toLowerCase() === String(name).toLowerCase());

// headingFor is what to print above a column.
//
// Read from the result the server described rather than recomputed here: the
// rule that decides it (the query's alias, then this report's label) lives
// on the server, and a second implementation in the page would be a second
// answer.
function headingFor(res, i) {
  if (res && res.headings && res.headings[i]) return res.headings[i];
  return res ? res.columns[i] : '';
}

const SRC_TEXT = {
  query: 'از خود پرس‌وجو',
  custom: 'عنوان این گزارش',
};

// loadColumnSuggestions asks the server what the last result's columns will be
// called.
async function loadColumnSuggestions() {
  const res = LAST_RESULT;
  if (!res || !res.columns || !res.columns.length) { COLSUGGEST = []; return; }
  try {
    const r = await api('/api/builder/params', {
      method: 'POST',
      body: JSON.stringify({ sql: $('sql').value, result: res.columns, columns: COLUMNS }),
    });
    if (!r.ok) { COLSUGGEST = []; return; }
    const d = await r.json();
    COLSUGGEST = d.columns || [];
    KINDS = d.kinds || KINDS;
    CHART_KINDS = d.charts || CHART_KINDS;
    CHART_AGGS = d.chartAggs || CHART_AGGS;
  CHART_BUCKETS = d.chartBuckets || CHART_BUCKETS;
  CHART_COMPARES = d.chartCompares || CHART_COMPARES;
  } catch (e) { COLSUGGEST = []; }
}

function renderColumnEditor() {
  const wrap = $('colsWrap');
  const res = LAST_RESULT;
  wrap.hidden = !res || !res.columns || !res.columns.length;
  if (wrap.hidden) { $('colsGrid').innerHTML = ''; return; }

  const unnamed = COLSUGGEST.filter(s => !s.source).length;
  $('colsState').textContent = unnamed
    ? faNum.format(unnamed) + ' ستون عنوان فارسی ندارد'
    : 'همهٔ ستون‌ها عنوان دارند';

  $('colsGrid').innerHTML =
    '<div class="colhead">ستون در پایگاه داده</div>' +
    '<div class="colhead">عنوانی که خواننده می‌بیند</div>' +
    '<div class="colhead"></div>' +
    '<div class="colhead colhide" title="عنوان شغلی را از نام‌ها جدا می‌کند">نام افراد</div>' +
    '<div class="colhead colhide">پنهان</div>' +
    res.columns.map((name, i) => {
      const s = COLSUGGEST[i] || { name, label: name, source: '' };
      const spec = colSpecFor(name) || {};
      // The box shows the report's OWN label only. Leaving it empty where the
      // query already names the column is what keeps the editor honest:
      // a box pre-filled with an inherited value looks like a decision this
      // report made, and would then be saved as one.
      const own = spec.label || '';
      const src = s.source ? (SRC_TEXT[s.source] || '') : 'عنوانی ندارد';
      return `<div class="colname" title="${esc(name)}">${esc(name)}</div>
        <div><input class="input" type="text" data-collabel="${i}"
             value="${esc(own)}" maxlength="80"
             placeholder="${esc(s.label || name)}"></div>
        <div class="colsrc${s.source ? '' : ' none'}">${esc(src)}</div>
        <div class="colhide"><input type="checkbox" data-colperson="${i}"
             ${spec.person ? 'checked' : ''}
             title="این ستون نام افراد است: عنوان شغلیِ چسبیده به نام جدا می‌شود تا یک نفر دو بار شمرده نشود"></div>
        <div class="colhide"><input type="checkbox" data-colhide="${i}"
             ${s.hidden ? 'checked' : ''}
             title="در جدول و فایل CSV نیاید"></div>`;
    }).join('');
}

// readColumns pulls the column decisions back out of the form.
//
// Only rows that SAY something are kept -- a label typed, or a hide state that
// differs from the default. Storing the rest would fill the saved report with
// "this column is called what it is already called", and the next person to
// read the file could not tell which headings were chosen.
function readColumns() {
  const grid = $('colsGrid');
  const res = LAST_RESULT;
  if (!res || !grid.children.length) return COLUMNS;

  const out = [];
  res.columns.forEach((name, i) => {
    const labelEl = grid.querySelector(`[data-collabel="${i}"]`);
    const hideEl = grid.querySelector(`[data-colhide="${i}"]`);
    const personEl = grid.querySelector(`[data-colperson="${i}"]`);
    const label = labelEl ? labelEl.value.trim() : '';
    const hidden = !!(hideEl && hideEl.checked);

    // Every column is shown unless the report hides it, so a hide is what
    // has to be recorded.
    const spec = { name };
    if (label) spec.label = label;
    if (hidden) spec.hide = true;
    if (personEl && personEl.checked) spec.person = true;
    if (spec.label || spec.hide || spec.show || spec.person) out.push(spec);
  });
  COLUMNS = out;
  return COLUMNS;
}

// columnOptions builds a <select> list over the result's columns, showing the
// heading and carrying the database name.
//
// Used by the chart and detail choosers. They have to send the raw name -- it
// is what the query returns -- but asking somebody to pick "STATUS_OF_SHIPPING_LABEL"
// from a list when the table above says «وضعیت ارسال» is asking them to hold
// two names for one column in their head.
function columnOptions(res, selected, blank) {
  const out = [];
  if (blank) out.push(`<option value=""${selected ? '' : ' selected'}>${esc(blank)}</option>`);
  res.columns.forEach((name, i) => {
    const head = headingFor(res, i);
    const shown = head === name ? name : head + ' (' + name + ')';
    out.push(`<option value="${esc(name)}"${name === selected ? ' selected' : ''}>${esc(shown)}</option>`);
  });
  return out.join('');
}

// ---------------------------------------------------------------- detail

// DETAIL is the second query, or null. Most reports have none.
let DETAIL = null;

// renderDetailEditor draws the key chooser from the result's own columns.
function renderDetailEditor() {
  const wrap = $('detailWrap');
  const res = LAST_RESULT;
  wrap.hidden = !res || !res.columns || !res.columns.length;
  if (wrap.hidden) { $('detailRow').innerHTML = ''; return; }

  const d = DETAIL || { sql: '', key: '', title: '' };
  $('detailRow').innerHTML = `
    <label>ستون کلید: مقداری که <code>@key</code> می‌گیرد
      <select class="select" id="dKey">
        ${columnOptions(res, d.key, 'انتخاب کنید…')}
      </select>
    </label>
    <label>عنوان بخش جزئیات (اختیاری)
      <input class="input" id="dTitle" maxlength="120" value="${esc(d.title || '')}">
    </label>`;
  // The query itself lives outside the row, because it is a code editor and
  // does not belong in a grid of one-line controls.
  if ($('detailSQL').value !== (d.sql || '')) $('detailSQL').value = d.sql || '';
}

function readDetail() {
  const sql = $('detailSQL') ? $('detailSQL').value.trim() : '';
  if (!sql) { DETAIL = null; return null; }
  DETAIL = {
    sql,
    key: $('dKey') ? $('dKey').value : '',
    title: $('dTitle') ? $('dTitle').value.trim() : '',
  };
  return DETAIL;
}

// detailReady says whether a row can be opened, and why not if it cannot.
//
// Checked in the page as well as on the server, because the page is where the
// answer is useful: the server can only say "@key is missing", while here the
// row simply does not offer to open and the panel says what is needed.
function detailReady() {
  if (!DETAIL || !DETAIL.sql) return '';
  if (!DETAIL.key) return 'ستون کلید را انتخاب کنید.';
  if (LAST_RESULT && !LAST_RESULT.columns.includes(DETAIL.key)) {
    return 'ستون کلید «' + DETAIL.key + '» در نتیجه نیست.';
  }
  // Matched the way the server matches it, so the page and the server agree
  // about whether a row is openable.
  if (!/(^|[^\w@])@key($|[^\w])/.test(DETAIL.sql)) {
    return 'پرس‌وجوی جزئیات باید @key را به‌کار ببرد، وگرنه همهٔ ردیف‌ها یک چیز را نشان می‌دهند.';
  }
  return 'ok';
}

// toggleDetail opens or closes the expansion under one master row.
async function toggleDetail(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detailrow')) {
    next.remove();
    tr.classList.remove('open');
    return;
  }
  // Only one open at a time. Several expansions at once turns the table into
  // a list of lists, and the point of this is to look at one row.
  const table = tr.closest('table');
  table.querySelectorAll('tr.detailrow').forEach(x => x.remove());
  table.querySelectorAll('tr.open').forEach(x => x.classList.remove('open'));
  tr.classList.add('open');

  const cols = tr.children.length;
  const row = document.createElement('tr');
  row.className = 'detailrow';
  row.innerHTML = `<td colspan="${cols}"><div class="detailwrap">
    <p class="hint" style="margin:0">در حال خواندن…</p></div></td>`;
  tr.after(row);

  const body = { key: tr.dataset.key || '', values: paramValues(), page: 1, per_page: 200 };
  // A saved report runs its own stored detail; a draft sends the one on screen
  // along with its filters. Same route, same binding.
  if (EDITING && EDITING.id && EDITING.detail) {
    body.report_id = EDITING.id;
  } else {
    body.source = $('runSource').value;
    body.sql = DETAIL.sql;
    body.params = PARAMS;
    body.columns = COLUMNS;
  }

  const wrap = row.querySelector('.detailwrap');
  try {
    const r = await api('/api/builder/detail', { method: 'POST', body: JSON.stringify(body) });
    if (!r.ok) {
      wrap.innerHTML = `<div class="err-sql">جزئیات خوانده نشد.<code>${esc(await errorOf(r))}</code></div>`;
      return;
    }
    const res = await r.json();
    const head = (DETAIL.title ? `<h5>${esc(DETAIL.title)}</h5>` : '');
    if (!res.rows.length) {
      wrap.innerHTML = head +
        '<div class="empty"><div>برای این ردیف چیزی ثبت نشده است.</div></div>';
      return;
    }
    // The detail's own columns get headings the same way the master's do, so
    // an opened row reads like the rest of the product rather than like the
    // aliases somebody typed.
    const dshown = res.columns.map((_, i) => i)
      .filter(i => !(res.hidden && res.hidden[i]));
    wrap.innerHTML = head +
      '<div class="table-scroll"><table class="data"><thead><tr>' +
      dshown.map(i => `<th>${esc(headingFor(res, i))}</th>`).join('') +
      '</tr></thead><tbody>' +
      res.rows.map(rr => '<tr>' + dshown.map(i =>
        `<td><span class="v">${rr[i] === null || rr[i] === undefined ? '' : esc(rr[i])}</span></td>`
      ).join('') + '</tr>').join('') +
      '</tbody></table></div>' +
      `<p class="chartfoot">${faNum.format(res.rows.length)} ردیف` +
      (res.has_more ? ' (بیشتر هم هست)' : '') + '</p>';
  } catch (e) {
    if (e.message !== 'unauthenticated') {
      wrap.innerHTML = `<div class="err-sql">جزئیات خوانده نشد.<code>${esc(e.message || '')}</code></div>`;
    }
  }
}

// ------------------------------------------------------------------- run

function renderResult(res) {
  const box = $('resBox');
  if (!res.rows.length) {
    box.innerHTML = '<div class="empty"><div>پرس‌وجو اجرا شد و ردیفی برنگرداند.</div></div>';
    return;
  }
  // Which columns the table shows, and under what heading.
  //
  // Hidden columns are left out of the TABLE only -- their values are still in
  // every row, which is what lets a detail query key on a case number nobody
  // wants to read and a chart plot a column nobody wants a table of.
  const show = res.columns.map((_, i) => !(res.hidden && res.hidden[i]));
  const shown = res.columns.map((_, i) => i).filter(i => show[i]);

  const head = '<tr><th class="rownum">#</th>' + shown.map(i => {
    const heading = headingFor(res, i);
    // The database name under the heading when they differ, because the
    // person editing the query needs to know which column this is, and the
    // type beside it for the same reason it was always there.
    const sub = [heading === res.columns[i] ? '' : res.columns[i],
                 (res.types && res.types[i]) || ''].filter(Boolean).join(' · ');
    return `<th>${esc(heading)}${sub ? `<span class="t">${esc(sub)}</span>` : ''}</th>`;
  }).join('') + '</tr>';

  // A row can be opened when there is a detail query that can run for it. The
  // key travels on the row as data, so clicking reads it from the row itself
  // rather than from an index into a list that may have been re-rendered.
  const openable = detailReady() === 'ok';
  const keyIdx = openable ? res.columns.indexOf(DETAIL.key) : -1;

  const start = (res.page - 1) * res.per_page;
  const body = res.rows.map((row, n) => {
    const key = keyIdx >= 0 && row[keyIdx] !== null ? String(row[keyIdx]) : '';
    // No marker on a row with no key: it would open to nothing, and offering
    // that is worse than not offering it.
    const can = openable && key !== '';
    return `<tr${can ? ' class="openable" data-key="' + esc(key) + '"' : ''}>` +
      '<td class="rownum">' + faNum.format(start + n + 1) + '</td>' +
      shown.map(i => {
        const v = row[i];
        return `<td><span class="v">${v === null || v === undefined ? '' : esc(v)}</span></td>`;
      }).join('') +
      '</tr>';
  }).join('');

  box.innerHTML =
    `<div class="resmeta">
       <span><b>${faNum.format(res.rows.length)}</b> ردیف</span>
       <span><b>${faNum.format(shown.length)}</b> ستون${
         shown.length === res.columns.length ? '' :
         ` (${faNum.format(res.columns.length - shown.length)} پنهان)`}</span>
       <span><b>${faNum.format(res.took_ms)}</b> میلی‌ثانیه</span>
       <span>صفحه <b>${faNum.format(res.page)}</b></span>
       ${res.truncated ? `<span>${faNum.format(res.truncated)} مقدار طولانی کوتاه شد</span>` : ''}
     </div>
     <div class="table-scroll"><table class="data"><thead>${head}</thead><tbody>${body}</tbody></table></div>
     <div class="pager">
       <button class="btn" id="prevPage"${res.page <= 1 ? ' disabled' : ''}>قبلی</button>
       <button class="btn" id="nextPage"${res.has_more ? '' : ' disabled'}>بعدی</button>
       <span class="spacer" style="margin-inline-start:auto"></span>
       ${EDITING && EDITING.id
         ? `<a class="btn" id="csvHere" href="${esc(exportURL(EDITING.id))}">CSV همین نتیجه</a>` : ''}
       <button class="btn" type="button" id="resPdf">${window.PDF_ICON || ''}<span>خروجی PDF</span></button>
     </div>`;

  $('prevPage').onclick = () => run(res.page - 1);
  $('nextPage').onclick = () => run(res.page + 1);

  // The same export the shipped reports have. It works here because the print
  // code walks whatever canvases and tables are on the page rather than
  // knowing anything about reports -- which is why it now lives in nav.js.
  //
  // The masthead carries the filter values and the page, for the reason it
  // does everywhere else: this is a page of a result, not the result, and a
  // sheet that does not say so gets read as the whole answer.
  $('resPdf').onclick = () => {
    if (typeof window.exportPDF !== 'function') return;
    const lines = [];
    const values = paramValues();
    for (const p of PARAMS) {
      if (values[p.name]) lines.push((p.label || p.name) + ': ' + values[p.name]);
    }
    lines.push('صفحه ' + faNum.format(res.page) +
               '، ' + faNum.format(res.rows.length) + ' ردیف');
    if (res.has_more) {
      lines.push('این برگه فقط ردیف‌های همین صفحه را دارد؛ برای همهٔ ردیف‌ها خروجی CSV بگیرید');
    }
    const title = ($('repTitle') && $('repTitle').value.trim()) ||
                  (EDITING && EDITING.title) || 'پرس‌وجوی سفارشی';
    window.exportPDF(title, lines);
  };

  // Delegated, so it survives paging without being re-bound per row.
  const table = box.querySelector('table.data');
  if (table && openable) {
    table.addEventListener('click', e => {
      const tr = e.target.closest('tr.openable');
      if (tr) toggleDetail(tr);
    });
  }
}

// exportURL carries the filter values that are on screen into the download.
//
// Built at render time from the boxes as they stand, not from the report's
// defaults. A CSV holding more rows than the table it was downloaded from is
// the kind of discrepancy that ends up in a meeting.
function exportURL(id) {
  const q = new URLSearchParams({ id });
  const values = paramValues();
  for (const [k, v] of Object.entries(values)) q.set(k, v);
  return '/api/builder/export?' + q.toString();
}

function showSqlError(msg) {
  $('sqlErr').innerHTML =
    `<div class="err-sql">پرس‌وجو اجرا نشد.<code>${esc(msg)}</code></div>`;
}

async function run(page) {
  const id = $('runSource').value;
  const sql = $('sql').value;
  if (!id) { toast('اول یک اتصال بسازید.', 'bad'); return; }
  if (!sql.trim()) { toast('پرس‌وجو خالی است.', 'bad'); return; }
  $('sqlErr').innerHTML = '';
  $('runBtn').disabled = true;
  try {
    const r = await busy(api('/api/builder/run', {
      method: 'POST',
      body: JSON.stringify({
        source: id, sql,
        // Declarations and values both, read from the form at the moment of
        // the run. That makes the preview the same thing as the save: whatever
        // is on screen is what gets checked, so a filter cannot preview
        // cleanly and then be refused.
        params: readDecls(),
        values: paramValues(),
        columns: readColumns(),
        page: page || 1,
        per_page: parseInt($('perPage').value, 10) || 100,
      }),
    }));
    if (!r.ok) {
      showSqlError(await errorOf(r));
      $('resBox').innerHTML = '';
      // The chart belonged to the result that just failed, so it must go too.
      // Leaving it up would show figures from the previous query beside an
      // error about this one.
      LAST_RESULT = null;
      $('chartBox').hidden = true;
      return;
    }
    LAST_RESULT = await r.json();
    // The column suggestions come from the server, which holds the rule that
    // names them. Asked with the result's own column names,
    // because "SELECT *" does not say what they are.
    await loadColumnSuggestions();
    renderColumnEditor();
    // The detail editor is rendered BEFORE the table, because the table needs
    // to know whether its rows can be opened.
    renderDetailEditor();
    const why = detailReady();
    $('detailState').textContent = why === 'ok' ? '' : why;
    renderResult(LAST_RESULT);
    renderChartEditor();
    await drawChart();
    await renderGallery();
  } catch (e) {
    if (e.message !== 'unauthenticated') showSqlError(e.message || 'ارتباط برقرار نشد.');
  } finally { $('runBtn').disabled = false; }
}

// --------------------------------------------------------- saved reports

function renderReports(list) {
  const box = $('repGrid');
  if (!list.length) {
    box.innerHTML = '<p class="hint" style="margin:0">' +
      'هنوز گزارشی ذخیره نشده است.</p>';
    return;
  }
  box.innerHTML = list.map(r => {
    const src = SOURCES.find(s => s.id === r.source_id);
    // h3, not h4: the section above these cards is an h2, and a heading that
    // skips a level tells a screen-reader user there is a level they missed.
    return `<div class="repcard">
      <h3>${esc(r.title)}</h3>
      ${r.description ? `<p>${esc(r.description)}</p>` : ''}
      <div class="meta">
        ${src ? esc(src.name) : '<b>اتصال این گزارش حذف شده است</b>'}
        ${r.author ? '، ' + esc(r.author) : ''}
      </div>
      <div class="acts">
        <button class="btn btn-sm btn-primary" data-open="${esc(r.id)}">اجرا</button>
        <button class="btn btn-sm" data-editrep="${esc(r.id)}">ویرایش</button>
        <a class="btn btn-sm" href="/api/builder/export?id=${encodeURIComponent(r.id)}">CSV</a>
        <button class="btn btn-sm btn-ghost" data-delrep="${esc(r.id)}">حذف</button>
      </div>
    </div>`;
  }).join('');
}

// loadReportIntoEditor puts a saved report back on screen.
//
// One function for the two buttons that do it -- "run" and "edit" differ only
// in what they do afterwards, and having each set up the editor itself is how
// one of them ends up forgetting the filters.
function loadReportIntoEditor(rep) {
  $('sql').value = rep.sql;
  if (SOURCES.some(s => s.id === rep.source_id)) $('runSource').value = rep.source_id;
  PARAMS = (rep.params || []).map(p => ({ ...p }));
  USED_NAMES = PARAMS.map(p => p.name);
  renderParams();
  // The chart is restored before the run, so the run draws it. Restoring it
  // afterwards would show the table first and the chart a moment later, which
  // reads as the page still loading.
  COLUMNS = (rep.columns || []).map(c => ({ ...c }));
  COLSUGGEST = [];
  CHART = rep.chart ? { ...rep.chart, values: [...(rep.chart.values || [])] } : null;
  DETAIL = rep.detail ? { ...rep.detail } : null;
  $('detailSQL').value = DETAIL ? DETAIL.sql : '';
  LAST_RESULT = null;
  $('chartBox').hidden = true;
  $('chartWrap').hidden = true;
  $('detailWrap').hidden = true;
  $('colsWrap').hidden = true;
}

// applyDefaults fills each filter box with the report's own default.
//
// Shown rather than left blank, even though a blank box and a box holding the
// default produce the same query. The reader has to be able to see what the
// report is currently filtered by: an empty box beside "1404" worth of results
// is the interface saying nothing while the data says otherwise.
function applyDefaults() {
  const box = $('paramsBox');
  PARAMS.forEach((p, i) => {
    const el = box.querySelector(`[data-val="${i}"]`);
    if (el && p.default) el.value = p.default;
  });
}

let REPORTS = [];
async function loadReports() {
  const d = await (await api('/api/builder/reports')).json();
  REPORTS = d.reports || [];
  renderReports(REPORTS);
}

// ------------------------------------------------------------------ wiring

function wire() {
  // --- connections
  $('newSrcBtn').addEventListener('click', () => openSourceForm(null));
  $('srcCancel').addEventListener('click', () => { $('srcForm').hidden = true; });
  $('srcDriver').addEventListener('change', showExample);

  $('srcForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('srcMsg').textContent = 'در حال ذخیره…';
    const r = await api('/api/builder/sources', {
      method: 'POST',
      body: JSON.stringify({
        id: $('srcForm').dataset.id || '',
        name: $('srcName').value,
        driver: $('srcDriver').value,
        note: $('srcNote').value,
        dsn: $('srcDSN').value,
      }),
    });
    if (!r.ok) { $('srcMsg').textContent = await errorOf(r); return; }
    $('srcMsg').textContent = '';
    $('srcForm').hidden = true;
    await loadSources();
    toast('اتصال ذخیره شد.');
  });

  // Test what is typed if there is something typed, and the saved one
  // otherwise -- which is the only way to test a connection whose string the
  // browser was never given.
  $('srcTest').addEventListener('click', async () => {
    $('srcMsg').textContent = 'در حال آزمودن…';
    const body = $('srcDSN').value.trim()
      ? { driver: $('srcDriver').value, dsn: $('srcDSN').value }
      : { id: $('srcForm').dataset.id || '' };
    const d = await (await api('/api/builder/test', {
      method: 'POST', body: JSON.stringify(body),
    })).json();
    $('srcMsg').textContent = d.ok
      ? 'وصل شد' + (d.server ? ': ' + d.server : '') + ` (${faNum.format(d.took_ms)}ms)`
      : 'وصل نشد: ' + (d.message || '');
  });

  $('srcList').addEventListener('click', async e => {
    const row = e.target.closest('[data-id]');
    const test = e.target.closest('[data-test]');
    const edit = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-del]');

    if (test) {
      const d = await (await api('/api/builder/test', {
        method: 'POST', body: JSON.stringify({ id: test.dataset.test }),
      })).json();
      toast(d.ok ? 'وصل شد' + (d.server ? ': ' + d.server : '') : 'وصل نشد: ' + d.message,
            d.ok ? 'ok' : 'bad');
      return;
    }
    if (edit) {
      openSourceForm(SOURCES.find(s => s.id === edit.dataset.edit));
      return;
    }
    if (del) {
      const id = del.dataset.del;
      let r = await api('/api/builder/sources?id=' + encodeURIComponent(id), { method: 'DELETE' });
      let d = await r.json();
      // Reports depend on it. Named, then confirmed -- deleting a connection
      // three reports use is a decision, not a click.
      if (d && d.in_use) {
        if (!confirm('این اتصال در این گزارش‌ها استفاده شده است:\n\n• ' +
                     d.in_use.join('\n• ') + '\n\nباز هم حذف شود؟')) return;
        r = await api('/api/builder/sources?id=' + encodeURIComponent(id) + '&force=1',
                      { method: 'DELETE' });
        d = await r.json();
      }
      if (!r.ok || (d && d.error && !d.ok)) { toast(d.error || 'حذف نشد.', 'bad'); return; }
      await loadSources();
      await loadReports();
      toast('اتصال حذف شد.');
      return;
    }
    if (row) {
      $('runSource').value = row.dataset.id;
      [...$('srcList').children].forEach(c => c.classList.toggle('on', c === row));
    }
  });

  // --- schema
  $('schemaBtn').addEventListener('click', loadSchema);
  $('schemaFind').addEventListener('input', renderSchema);
  $('schemaBox').addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]');
    const ins = e.target.closest('[data-insert]');
    if (t) {
      const cols = $('schemaBox').querySelector(`[data-cols="${t.dataset.toggle}"]`);
      if (cols) cols.classList.toggle('open');
      // A click on the table row opens its columns; it does not also insert
      // the name, because the commonest reason to click a table is to look
      // inside it.
      return;
    }
    if (ins) insertAtCursor(ins.dataset.insert);
  });
  // The connection changed, so the tables on screen belong to the wrong one.
  $('runSource').addEventListener('change', () => {
    if ($('runSource').value !== SCHEMA_FOR) {
      SCHEMA = []; SCHEMA_FOR = '';
      renderSchema();
    }
  });

  // --- run
  $('runBtn').addEventListener('click', () => run(1));
  $('sql').addEventListener('keydown', e => {
    // Ctrl+Enter, which is what every database client uses.
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(1); }
  });

  // --- filters
  // On blur rather than on input. A request per keystroke would be wasteful,
  // but the real reason is that rebuilding the panel mid-word moves the caret
  // out from under whoever is typing -- and the filters panel is below the
  // editor, so nothing is lost by waiting until they look away from it.
  $('sql').addEventListener('blur', () => syncParams(true));
  $('paramsSync').addEventListener('click', () => syncParams(false));

  // A type is chosen, so the row has to become the controls that type needs --
  // a dropdown grows an options box, a date grows a calendar choice.
  $('paramsBox').addEventListener('change', e => {
    const fill = e.target.closest('[data-fillfrom]');
    if (fill) { fillOptionsFrom(fill); return; }
    // The value box is only wired to a datalist when the row is rendered, so
    // naming a suggestion source has to re-render -- on blur, not while the
    // name is still being typed.
    if (e.target.matches('[data-kind], [data-cal], [data-sug]')) {
      readDecls();
      renderParams();
      return;
    }
    if (e.target.matches('[data-sugperson]')) readDecls();
  });
  // Completions as the reader types, and the declaration re-read when the
  // source column changes so the box knows where to ask.
  $('paramsBox').addEventListener('input', e => {
    if (e.target.matches('[data-val]')) { suggestFor(e.target); return; }
    if (e.target.matches('[data-sug]')) readDecls();
  });
  // Filling the box for the first time should offer something before a key is
  // pressed, so the list is there when it is clicked into.
  $('paramsBox').addEventListener('focusin', e => {
    if (e.target.matches('[data-val]')) suggestFor(e.target);
  });

  // Enter in a filter box runs, which is what a filter box invites.
  $('paramsBox').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('[data-val]') &&
        e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      run(1);
    }
  });

  // Which engine is selected decides which types are offered, so the panel is
  // rebuilt when it changes -- otherwise "any of several values" would stay
  // enabled after switching to SQL Server and be refused on save.
  $('runSource').addEventListener('change', () => {
    if (PARAMS.length) { readDecls(); renderParams(); }
  });

  // --- chart
  // Redrawn on every change, with no "apply" button. The whole point of
  // choosing a column here is to see what it looks like, and a chart that
  // waits to be asked is one nobody experiments with.
  //
  // The combination and the label change which controls exist at all --
  // counting needs no value column, and the value list never offers the
  // column already used as the label -- so those rebuild the panel before the
  // redraw. The TYPE is chosen from the gallery, which rebuilds everything.
  $('chartRow').addEventListener('change', async e => {
    readChart();
    // The bucket decides whether the comparison control exists at all, so it
    // rebuilds the row.
    if (e.target.matches('#cAgg, #cLabel, #cBucket, #cCompare')) renderChartEditor();
    await drawChart();
    await renderGallery();
  });
  $('chartRow').addEventListener('input', async e => {
    if (e.target.matches('#cTitle, #cBins')) { readChart(); await drawChart(); }
  });

  // --- the gallery
  // One handler for the whole grid, because the tiles are rebuilt on every
  // run and per-tile listeners would have to be rebound with them.
  $('chartGallery').addEventListener('click', e => {
    const tile = e.target.closest('.gtile');
    if (tile && !tile.classList.contains('off')) pickKind(tile.dataset.kind);
  });
  // Reachable without a mouse: the tiles are buttons, so they answer to a key
  // the way buttons do.
  $('chartGallery').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.gtile');
    if (tile && !tile.classList.contains('off')) {
      e.preventDefault();
      pickKind(tile.dataset.kind);
    }
  });
  $('chartNone').addEventListener('click', async () => {
    CHART = null;
    renderChartEditor();
    await drawChart();
    await renderGallery();
  });

  // --- columns
  // A heading or a hide redraws the table from the result already in hand.
  // No re-query: the rows have not changed, only what they are called and
  // which of them are shown.
  //
  // The chart and detail panels are redrawn too, because their column lists
  // show headings -- relabel a column and the chooser must say the new name.
  const columnsChanged = async () => {
    readColumns();
    if (!LAST_RESULT) return;
    LAST_RESULT.headings = LAST_RESULT.columns.map((name, i) => {
      const own = COLUMNS.find(c => c.name.toLowerCase() === name.toLowerCase());
      // The report's own label wins; otherwise fall back to what the server
      // said, which already applied the query's alias.
      if (own && own.label) return own.label;
      const s = COLSUGGEST[i];
      return (s && s.source !== 'custom' && s.label) || name;
    });
    LAST_RESULT.hidden = LAST_RESULT.columns.map((name, i) => {
      const own = COLUMNS.find(c => c.name.toLowerCase() === name.toLowerCase());
      if (own && own.hide) return true;
      if (own && own.show) return false;
      return false;
    });
    renderResult(LAST_RESULT);
    renderChartEditor();
    renderDetailEditor();
    await drawChart();
    // The gallery names its columns by their headings, so relabelling one has
    // to redraw the tiles as well as the chart.
    await renderGallery();
  };
  $('colsGrid').addEventListener('change', async e => {
    // Folding people happens on the server, because the rule for what counts
    // as the same person lives there and a second copy in this page would be
    // a second answer. So this one control re-runs rather than redrawing --
    // the values themselves change, not just what they are called.
    if (e.target.matches('[data-colperson]')) {
      readColumns();
      await run(1);
      return;
    }
    columnsChanged();
  });
  // Typing a heading updates the table as it is typed, which is the point of
  // having the table right there.
  $('colsGrid').addEventListener('input', e => {
    if (e.target.matches('[data-collabel]')) columnsChanged();
  });

  // --- detail
  // Changing the key or the query changes which rows can be opened, so the
  // table is redrawn from the result already in hand rather than re-queried:
  // the rows have not changed, only whether they carry a marker.
  const detailChanged = () => {
    readDetail();
    const why = detailReady();
    $('detailState').textContent = why === 'ok' ? '' : why;
    if (LAST_RESULT) renderResult(LAST_RESULT);
  };
  $('detailRow').addEventListener('change', detailChanged);
  // On blur for the query, for the same reason the main editor syncs on blur:
  // redrawing the table under somebody mid-word is worse than waiting.
  $('detailSQL').addEventListener('blur', detailChanged);

  // --- saving
  $('saveBtn').addEventListener('click', () => {
    if (!$('sql').value.trim()) { toast('پرس‌وجو خالی است.', 'bad'); return; }
    $('saveMsg').textContent = '';
    $('repTitle').value = EDITING ? EDITING.title : '';
    $('repDesc').value = EDITING ? (EDITING.description || '') : '';
    $('saveSheet').showModal();
    $('repTitle').focus();
  });
  $('saveSheet').addEventListener('click', e => {
    if (e.target.closest('[data-close]') || e.target === $('saveSheet')) $('saveSheet').close();
  });
  $('saveForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('saveMsg').textContent = 'در حال ذخیره…';
    const r = await api('/api/builder/reports', {
      method: 'POST',
      body: JSON.stringify({
        id: EDITING ? EDITING.id : '',
        source_id: $('runSource').value,
        title: $('repTitle').value,
        description: $('repDesc').value,
        sql: $('sql').value,
        params: readDecls(),
        columns: readColumns(),
        chart: readChart(),
        detail: readDetail(),
      }),
    });
    if (!r.ok) { $('saveMsg').textContent = await errorOf(r); return; }
    EDITING = await r.json();
    $('saveSheet').close();
    await loadReports();
    toast('گزارش ذخیره شد.');
  });

  $('repGrid').addEventListener('click', async e => {
    const open = e.target.closest('[data-open]');
    const ed = e.target.closest('[data-editrep]');
    const del = e.target.closest('[data-delrep]');
    if (open) {
      const rep = REPORTS.find(x => x.id === open.dataset.open);
      if (!rep) return;
      // Loaded into the editor as well as run, so "run" and "look at what it
      // does" are the same action. An opaque saved report is one nobody
      // trusts.
      EDITING = rep;
      loadReportIntoEditor(rep);
      // The filter boxes start at their defaults, then it runs -- so opening a
      // report shows the report, not an empty screen waiting for input.
      await syncParams(true);
      applyDefaults();
      run(1);
      $('sql').scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
    if (ed) {
      const rep = REPORTS.find(x => x.id === ed.dataset.editrep);
      if (!rep) return;
      EDITING = rep;
      loadReportIntoEditor(rep);
      await syncParams(true);
      toast('برای ذخیرهٔ تغییرات، «ذخیره به‌عنوان گزارش» را بزنید.');
      $('sql').focus();
      return;
    }
    if (del) {
      const rep = REPORTS.find(x => x.id === del.dataset.delrep);
      if (!rep || !confirm(`گزارش «${rep.title}» حذف شود؟`)) return;
      const r = await api('/api/builder/reports?id=' + encodeURIComponent(rep.id), { method: 'DELETE' });
      if (!r.ok) { toast(await errorOf(r), 'bad'); return; }
      if (EDITING && EDITING.id === rep.id) EDITING = null;
      await loadReports();
      toast('گزارش حذف شد.');
    }
  });
}

// -------------------------------------------------------------------- boot

async function init() {
  try {
    const meta = await (await api('/api/me')).json();
    if (meta.auth_enabled && !meta.user) { location.replace('/login?next=/builder'); return; }
    me = meta.user;
    if (window.docfindPrefs) window.docfindPrefs.write((me && me.prefs) || null);
    $('who').textContent = me ? (me.display_name || me.username) : '';
    buildNav({
      reports: true, admin: !!me && me.role === 'admin',
      mail: !!(me && me.has_mail),
      user: me ? (me.display_name || me.username) : null,
      account: me,
      onSignOut: () => fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
        .finally(() => location.replace('/login')),
    });
  } catch (e) { return; }

  // Administrators only, and said plainly rather than shown as an empty page.
  //
  // The server refuses every route on this page to anybody else, so this is
  // not the access control -- it is the explanation. A viewer who follows a
  // link here should be told why there is nothing for them, not left looking
  // at skeletons that never fill in.
  if (!me || me.role !== 'admin') {
    $('main').innerHTML =
      '<div class="card"><div class="card-body"><div class="empty"><div>' +
      'ساختن گزارش تنها برای مدیر ارشد است.' +
      '</div></div></div></div>';
    return;
  }

  $('main').innerHTML = '';
  $('main').appendChild($('tplBuilder').content.cloneNode(true));
  wire();
  try {
    await loadSources();
    await loadReports();
    // With an empty editor this finds no filters; what it does do is fetch the
    // list of filter types, so the first row rendered already has its dropdown
    // instead of a fallback.
    await syncParams(true);
  } catch (e) {
    if (e.message !== 'unauthenticated') {
      failInto($('main'), 'خواندن تنظیمات سازندهٔ گزارش انجام نشد.');
    }
  }
}

// failInto is defined in the other pages' scripts rather than nav.js; a
// third copy is not worth it for one call site.
function failInto(el, text) {
  el.innerHTML = `<div class="card"><div class="err">${esc(text)}</div></div>`;
}

const out = $('signout');
if (out) out.addEventListener('click', () =>
  fetch('/api/logout', { method: 'POST', credentials: 'same-origin' })
    .finally(() => location.replace('/login')));

init();
</script>
