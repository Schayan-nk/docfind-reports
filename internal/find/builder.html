<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#142F40">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="گزارش‌ها">
<title>ساختن گزارش | گزارش‌ها</title>
<link rel="stylesheet" href="/app.css">
<style>
  /* The widest of the three content widths: this page shows a query beside
     its result, and a form column would make both unreadable. */
  body { --page-max: var(--content-wide); }

  main {
    padding: var(--s4); max-width: var(--content-wide); margin-inline: auto;
    display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr);
  }

  /* Two columns where there is room: the tables on one side, the query and
     its result on the other. minmax(0, 1fr) on the second so a wide result
     table scrolls inside its own box instead of pushing the page sideways --
     the same fix the other three pages needed. */
  .work { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1100px) {
    .work { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
  }

  /* ---- connections ---- */
  .srclist { display: grid; gap: var(--s2); }
  .srcrow {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    padding: 10px 12px; border-radius: var(--radius);
    background: var(--surface-2); border: 1px solid var(--line-soft);
  }
  .srcrow.on { border-color: var(--accent); background: var(--accent-soft); }
  .srcrow .nm { font-weight: 650; }
  .srcrow .sm {
    font: 500 12px/1.5 var(--font-latin); color: var(--fg-muted);
    direction: ltr; text-align: left;
  }
  .srcrow .eng {
    font-size: 11.5px; padding: 1px 7px; border-radius: var(--radius-full);
    background: var(--surface-3); color: var(--fg-muted);
  }
  .srcrow .acts { margin-inline-start: auto; display: flex; gap: 6px; }

  /* ---- the schema tree ---- */
  .schemabox { max-height: 60vh; overflow: auto; overscroll-behavior: contain; }
  .tbl {
    padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer;
    font: 500 13px/1.5 var(--font-latin); direction: ltr; text-align: left;
  }
  .tbl:hover { background: var(--surface-2); }
  .tbl .k { font-size: 11px; color: var(--fg-faint); }
  .cols { margin: 2px 0 8px 10px; display: none; }
  .cols.open { display: block; }
  .col {
    display: flex; gap: 8px; padding: 3px 8px; cursor: pointer;
    font: 500 12px/1.5 var(--font-latin); direction: ltr; text-align: left;
    border-radius: var(--radius-sm);
  }
  .col:hover { background: var(--surface-2); }
  .col .ty { color: var(--fg-faint); margin-inline-start: auto; }

  /* ---- the editor ---- */
  /* Latin, monospace, left-to-right. SQL is code: it is written in ASCII, it
     is read by column position, and setting it in the page's Persian face at
     the page's direction makes "WHERE a > 1" unreadable. */
  #sql {
    width: 100%; min-height: 200px; resize: vertical;
    font: 400 13.5px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    /* The query editor sets its own monospace font, so the 16px floor in
       app.css -- which is written for .input -- does not reach it. On iOS a
       field under 16px zooms the page in on focus and does not zoom out
       again, and this is the one field on the page somebody types a lot into.
       Measured at 13.5px on an emulated iPhone. */
    direction: ltr; text-align: left; white-space: pre;
    tab-size: 2; overflow-wrap: normal; overflow-x: auto;
  }
  .runbar { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-top: var(--s3); }
  .runbar .spacer { margin-inline-start: auto; }
  .hint-sql {
    margin: var(--s2) 0 0; font-size: 12.5px; color: var(--fg-faint); line-height: 1.7;
  }

  /* ---- filters ---- */
  /* One row per @name in the query, and each row is two halves with a rule
     between them: on the right what the filter IS, which is saved with the
     report, and on the left the value for THIS run, which is not. The two are
     side by side rather than in separate panels because on this page the
     author and the reader are the same administrator, and making them type a
     filter's name twice in two places to try it would be the kind of interface
     that gets abandoned. The rule is what keeps "saved" and "not saved"
     legible. */
  .params { margin-top: var(--s3); }
  .prow {
    display: grid; gap: var(--s2) var(--s3); align-items: end;
    grid-template-columns: max-content 1fr 1fr;
    padding: var(--s3) 0; border-block-start: 1px solid var(--line);
  }
  .prow:first-of-type { border-block-start: 0; }
  .prow > label { display: block; font-size: 12px; color: var(--fg-muted); }
  .prow .input, .prow .select { margin-top: 4px; }
  /* The name is the query's own text, so it is Latin and left-to-right even
     in a Persian row -- it has to be recognisable as the same string that
     appears in the SQL above. */
  .pname {
    font: 600 13px/1.6 var(--font-latin); direction: ltr;
    color: var(--accent); background: var(--accent-soft);
    padding: 4px var(--s2); border-radius: var(--radius-sm); white-space: nowrap;
    align-self: center;
  }
  .pval {
    grid-column: 1 / -1; padding-top: var(--s3);
    border-block-start: 1px dashed var(--line);
  }
  .pval > label { display: block; font-size: 12px; color: var(--fg-muted); }
  /* Every textarea in a filter row, not only the ones in .pval. Without this
     they fall back to the browser's default ~20-column monospace box, which
     breaks Persian across lines and leaves the label wrapped around it. */
  /* Tall enough for three lines plus padding. Three because that is what a
     short list of options or firms actually is, and a box that hides the third
     one behind a scrollbar reads as though it did not save. */
  .prow textarea {
    width: 100%; min-height: 88px; resize: vertical; margin-top: 4px;
    font: inherit; line-height: 1.7;
  }
  /* The options list is structurally left-to-right: each line is a database
     VALUE, then "|", then a Persian label. Setting the box LTR keeps the bar
     between them and lets bidi handle the Persian half as its own run --
     whereas in an RTL box the separator jumps to the wrong side of the label. */
  .prow textarea[data-opts] {
    direction: ltr; text-align: left;
    font-family: var(--font-latin);
  }
  .phint { margin: var(--s2) 0 0; font-size: 12px; color: var(--fg-faint); line-height: 1.7; }
  /* A filter the query no longer mentions. Kept rather than deleted -- the
     person may be mid-edit -- but it has to look inert, or they will fill it
     in and wonder why nothing changed. */
  .prow.punused { opacity: .55; }
  .prow.punused .pname { color: var(--fg-faint); background: var(--surface-2); }
  .pnote {
    grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--warn-ink);
  }
  @media (max-width: 720px) {
    .prow { grid-template-columns: 1fr; }
  }

  /* ---- the chart ---- */
  /* Above the table, not below it. The same decision as the reports page,
     made for the same reason: the chart is the answer and the table is the
     working, so a reader who scrolls to the figures first should meet the
     shape of them before the rows. */
  .chartbox { margin: var(--s4) 0 0; }
  /* A fixed height, so a chart of thirty bars is a chart you can see all of
     rather than a page you scroll through one bar at a time. The reports page
     learned this the hard way -- thirteen growing charts made it 15,908px
     tall -- so this box never grows and the canvas fits inside it. */
  .chartwin {
    position: relative; height: 340px;
    padding: var(--s3); background: var(--surface-2);
    border: 1px solid var(--line-soft); border-radius: var(--radius);
  }
  .chartwin canvas { display: block; }
  .chartfoot {
    margin: var(--s2) 0 0; font-size: 12px; color: var(--fg-faint); line-height: 1.7;
  }
  /* What the chart could not read. Never silent: a column of "۱٫۲۰۰ ریال"
     that parses as nothing would otherwise draw an empty chart and look like
     a bug in the program rather than a fact about the column. */
  .chartwarn {
    margin: var(--s2) 0 0; padding: 8px 11px; font-size: 12px; line-height: 1.7;
    color: var(--warn-ink); background: var(--warn-bg);
    border-radius: var(--radius-sm);
  }
  /* Aligned to the TOP, not the bottom. The value-columns box is a list and
     so much taller than the single-line controls beside it; bottom alignment
     made it grow upward out of the row and collide with the panel heading. */
  .crow {
    display: grid; gap: var(--s2) var(--s3); align-items: start;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    margin-top: var(--s3);
  }
  .crow > label { display: block; font-size: 12px; color: var(--fg-muted); }
  .crow .input, .crow .select { margin-top: 4px; }
  /* The value columns are a multiple-selection list rather than checkboxes:
     the column count is whatever the query returned, and forty checkboxes is
     not a control. Sized to show several at once, because one visible row
     hides the fact that it is a list. */
  /* No chevron and no start padding: .select paints a dropdown arrow, which
     inside a multi-line list box floats over the options and points at
     nothing -- the control does not drop down. */
  .crow select[multiple] {
    height: 8.5rem; padding: 6px; cursor: default;
    background-image: none; padding-inline-start: 6px;
  }
  /* Column names come from somebody else's database, so they are Latin and
     read left to right even inside this Persian panel. */
  .crow select option, .crow select[multiple] option {
    direction: ltr; text-align: left; font-family: var(--font-latin);
  }

  /* ---- the chart gallery ---- */
  /* Tiles showing each type drawn from THIS result, rather than a dropdown of
     names. Somebody choosing a chart is choosing how their data will look,
     and a list of words makes them imagine it; twelve small pictures of their
     own numbers makes them see it. The previews are drawn by the same
     function as the real chart, so a tile cannot promise a different picture
     from the one that follows. */
  .gallery {
    display: grid; gap: var(--s2); margin-top: var(--s3);
    grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
  }
  .gtile {
    position: relative; padding: 6px 6px 4px; cursor: pointer; text-align: center;
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-radius: var(--radius); color: var(--fg-muted);
    font: 500 11.5px/1.5 var(--font); transition: border-color .12s, background .12s;
  }
  .gtile:hover { border-color: var(--accent-hover); color: var(--fg); }
  .gtile.on {
    border-color: var(--accent); background: var(--accent-soft); color: var(--fg);
  }
  .gtile.on::after {
    content: '✓'; position: absolute; inset-block-start: 4px; inset-inline-end: 6px;
    color: var(--accent); font-size: 12px; font-weight: 700;
  }
  /* A type this result cannot produce. Dimmed and unclickable, with the
     reason in its place -- "why can I not choose a scatter" answered before
     it is asked, rather than by an error after. */
  .gtile.off { opacity: .45; cursor: not-allowed; }
  .gtile.off:hover { border-color: var(--line-soft); }
  /* The canvas gets its size from a container of a FIXED height, not from a
     height of its own.
     Chart.js in responsive mode sizes the canvas to its parent and then the
     parent to its contents if it can -- so a canvas with height:74px inside a
     tile with no height grew to 360px on the first draw, each feeding the
     other. The same feedback that once froze the reports page, and the same
     fix: give the box a height and let the canvas fill it. */
  .gcv { position: relative; height: 74px; }
  .gtile canvas { display: block; }
  .gtile .gwhy {
    display: flex; align-items: center; justify-content: center;
    height: 74px; padding: 0 4px; font-size: 10.5px; color: var(--fg-faint);
  }
  .gtile .gname { display: block; margin-top: 3px; }
  /* The recommendation, marked on its tile so the suggestion sits on the
     thing it suggests rather than in a sentence somewhere else. */
  .gtile .gstar {
    position: absolute; inset-block-start: 4px; inset-inline-start: 6px;
    font-size: 11px; color: var(--accent-lift);
  }
  .grec {
    margin: var(--s3) 0 0; font-size: 12.5px; color: var(--fg-muted); line-height: 1.7;
  }
  .grec b { color: var(--fg); }

  /* ---- column headings ---- */
  /* A grid of one row per column. Dense on purpose: a query returning thirty
     columns has to be scannable, and the common case is reading down the
     "what it will be called" column and touching nothing. */
  .colgrid {
    display: grid; gap: 0; margin-top: var(--s3);
    grid-template-columns: minmax(8rem, 1fr) minmax(9rem, 1.4fr) max-content max-content max-content;
    align-items: center;
  }
  .colgrid > * { padding: 6px var(--s2); border-block-start: 1px solid var(--line-soft); }
  .colgrid > .colhead {
    border-block-start: 0; padding-block-end: var(--s2);
    font-size: 11.5px; font-weight: 600; color: var(--fg-faint);
  }
  /* The database's own name, so it is Latin and left-to-right even here. */
  .colname {
    font: 500 12.5px/1.6 var(--font-latin); direction: ltr; text-align: left;
    color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .colgrid input[type="text"] { width: 100%; }
  /* Where the heading came from. Worth saying: "from the query" and
     "nothing names this column" look identical in a table of headings, and they
     need different actions from the reader. */
  .colsrc { font-size: 11px; color: var(--fg-faint); white-space: nowrap; }
  .colsrc.none { color: var(--warn-ink); }
  .colgrid .colhide { text-align: center; }
  @media (max-width: 720px) {
    .colgrid { grid-template-columns: 1fr max-content; }
    .colgrid > .colhead:nth-child(n+3) { display: none; }
    .colgrid > .colsrc { display: none; }
  }

  /* ---- master and detail ---- */
  /* A master row that can be opened says so before it is clicked: the cursor
     changes and a marker sits in the row-number cell, because a table whose
     rows are secretly clickable is a table nobody clicks. */
  table.data tr.openable { cursor: pointer; }
  table.data tr.openable:hover > td { background: var(--accent-soft); }
  table.data tr.openable .rownum::after {
    content: '▸'; margin-inline-start: 5px; color: var(--accent); font-size: 11px;
  }
  table.data tr.openable.open .rownum::after { content: '▾'; }
  /* The expansion. Indented by a left border in the reading direction, so it
     reads as belonging to the row above rather than as another master row. */
  tr.detailrow > td {
    padding: 0 !important;
    border-inline-start: 3px solid var(--accent);
    background: var(--surface-2);
  }
  .detailwrap { padding: var(--s3); }
  .detailwrap h5 {
    margin: 0 0 var(--s2); font-size: 12.5px; font-weight: 600; color: var(--fg-muted);
  }
  .detailwrap table.data { font-size: 12.5px; }
  .detailwrap .empty { padding: var(--s3) 0; }
  /* The detail query is code, like the main one. */
  #detailSQL {
    width: 100%; min-height: 110px; resize: vertical; margin-top: 4px;
    font: 400 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    /* Same iOS floor as #sql: its own monospace font shorthand overrides the
       16px rule that .input would otherwise have given it. */
    direction: ltr; text-align: left; white-space: pre;
    tab-size: 2; overflow-wrap: normal; overflow-x: auto;
  }

  /* Both query editors at the iOS zoom threshold, on a touch device.
     Below 16px, Safari zooms the page in when the field takes focus and does
     not zoom out when it leaves -- and these are the two fields on this page
     somebody types into at length.
     any-pointer, not pointer: an iPad with a Magic Keyboard reports a FINE
     primary pointer and is still iOS Safari.
     Placed AFTER both definitions on purpose. Each sets its size through a
     `font:` shorthand of equal specificity, so an identical rule written
     above them loses on source order and silently does nothing -- which is
     what the first version of this did, and the measurement showed
     #detailSQL still sitting at 13px while #sql had moved. */
  @media (any-pointer: coarse) {
    #sql, #detailSQL { font-size: 16px; }
  }

  /* The result. Its own scroll box, so a forty-column query does not widen
     the page.
     The wrapper is app.css's .table-scroll, not a .scroll of this page's own
     invention -- which is what it was, and nothing styled it. The result had
     never actually scrolled; it simply had not been wide enough to notice
     until the headings arrived and a SELECT * over twelve columns pushed the
     whole page 600px sideways. */
  .resbox { margin-top: var(--s4); min-width: 0; }
  /* And the card has to be allowed to be narrower than its own content, or
     the scroll box has no definite width to scroll inside and the table
     widens its ancestors instead. */
  .work > .card, .work > .card > .card-body { min-width: 0; }
  .resmeta {
    display: flex; gap: var(--s3); flex-wrap: wrap; align-items: baseline;
    font-size: 12.5px; color: var(--fg-muted); margin-bottom: var(--s2);
  }
  .resmeta b { color: var(--fg); font-variant-numeric: tabular-nums; }
  /* Values are data from another system: Latin numbers, left-aligned, so a
     reference number reads the same here as in the database client. */
  table.data td .v { direction: ltr; display: inline-block; text-align: left; }
  table.data th .t {
    display: block; font: 500 10.5px/1.4 var(--font-latin);
    color: var(--fg-faint); text-transform: uppercase; letter-spacing: .04em;
  }

  /* ---- saved reports ---- */
  .repgrid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .repcard {
    padding: 13px 15px; border-radius: var(--radius-lg);
    background: var(--surface-2); border: 1px solid var(--line-soft);
    border-inline-start: 3px solid var(--accent);
  }
  .repcard h3 { margin: 0 0 4px; font-size: 15px; }
  .repcard p { margin: 0 0 8px; font-size: 13px; color: var(--fg-muted); line-height: 1.7; }
  .repcard .meta { font-size: 11.5px; color: var(--fg-faint); }
  .repcard .acts { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

  .err-sql {
    margin-top: var(--s3); padding: 10px 13px; border-radius: var(--radius);
    background: var(--bad-bg); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    font-size: 13.5px; line-height: 1.75; color: var(--fg);
  }
  /* The database's own words, kept in its own direction so a quoted column
     name is readable. */
  .err-sql code {
    display: block; margin-top: 6px; direction: ltr; text-align: left;
    font: 400 12.5px/1.6 ui-monospace, Consolas, monospace; color: var(--bad-ink);
  }
</style>
</head>
<body>
<header class="appbar">
  <!-- Mark and visible title removed from the header, as on every other
       page. The heading stays, said rather than shown -- see .sr-only. -->
  <h1 class="sr-only">ساختن گزارش</h1>
  <span class="spacer"></span>
  <span id="who" class="hint collapses" style="margin:0"></span>
  <button class="btn btn-ghost btn-sm collapses" id="signout">خروج</button>
</header>

<script src="/nav.js"></script>
<main id="main">
  <div class="card"><div class="skel"><i></i><i style="width:78%"></i><i style="width:88%"></i></div></div>
</main>

<!-- ============================================================ templates -->

<template id="tplBuilder">
  <!-- Connections. First, because nothing else on the page works without
       one, and an administrator arriving here for the first time has none. -->
  <section class="card">
    <h2 class="card-head">
      <span>اتصال‌های پایگاه داده</span>
      <span class="spacer" style="margin-inline-start:auto"></span>
      <button class="btn btn-sm" id="newSrcBtn">اتصال تازه</button>
    </h2>
    <div class="card-body">
      <div class="srclist" id="srcList"></div>

      <form id="srcForm" hidden style="margin-top:var(--s4)">
        <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3)">
          <label>نام
            <input class="input" id="srcName" required maxlength="80"
                   placeholder="مثلاً پایگاه دادهٔ فروش">
          </label>
          <label>موتور
            <select class="select" id="srcDriver"></select>
          </label>
        </div>
        <label style="display:block;margin-top:var(--s3)">رشتهٔ اتصال
          <input class="input" id="srcDSN" autocomplete="off" spellcheck="false"
                 style="direction:ltr;text-align:left;font-family:var(--font-latin)">
        </label>
        <p class="hint" id="srcExample" style="direction:ltr;text-align:left"></p>
        <!-- Said once, here, where the decision is made. A read-only account
             is the measure that actually protects these databases; the
             SELECT-only check in the application is the second line, not the
             first. -->
        <p class="hint-sql">
          از حسابی استفاده کنید که فقط اجازهٔ خواندن دارد. این برنامه هر چیزی
          جز <code>SELECT</code> را رد می‌کند، اما آن بررسی لایهٔ دوم است؛
          لایهٔ اول دسترسی همان حساب در پایگاه داده است.
        </p>
        <label style="display:block;margin-top:var(--s3)">یادداشت (اختیاری)
          <input class="input" id="srcNote" maxlength="200"
                 placeholder="این سرور برای چیست؟">
        </label>
        <div class="runbar">
          <button class="btn btn-primary" type="submit" id="srcSave">ذخیره</button>
          <button class="btn" type="button" id="srcTest">آزمودن اتصال</button>
          <button class="btn btn-ghost" type="button" id="srcCancel">لغو</button>
          <span class="spacer"></span>
          <span class="hint" id="srcMsg" style="margin:0"></span>
        </div>
      </form>
    </div>
  </section>

  <div class="work">
    <!-- What is in there. Without this the only way to write a query is to
         already know every table name. -->
    <section class="card">
      <h2 class="card-head">
        <span>جدول‌ها</span>
        <span class="spacer" style="margin-inline-start:auto"></span>
        <button class="btn btn-sm" id="schemaBtn">خواندن</button>
      </h2>
      <div class="card-body">
        <div class="search" style="margin-bottom:var(--s3)">
          <svg class="ic-search" aria-hidden="true"><use href="#i-search"/></svg>
          <!-- A placeholder is not a label: it disappears the moment somebody
               types, and a screen reader announces this as "search" with no
               indication of what is being searched. -->
          <span class="ring"><input class="input" id="schemaFind" type="search"
                 aria-label="جستجوی جدول یا ستون"
                 placeholder="جستجوی جدول یا ستون" autocomplete="off"></span>
        </div>
        <div class="schemabox" id="schemaBox">
          <p class="hint" style="margin:0">یک اتصال انتخاب کنید و «خواندن» را بزنید.</p>
        </div>
      </div>
    </section>

    <!-- The query and its answer. -->
    <section class="card">
      <h2 class="card-head">
        <span>پرس‌وجو</span>
        <span class="spacer" style="margin-inline-start:auto"></span>
        <!-- Named for a screen reader: the heading beside it says "query", not
             which connection this chooses, and a control read on its own
             announced only "combo box". -->
        <select class="select" id="runSource" style="width:auto;min-width:11rem"
                aria-label="اتصال پایگاه داده"></select>
      </h2>
      <div class="card-body">
        <!-- The heading above this card says "پرس‌وجو", but a heading is not a
             label: read on its own this announced only "text area". It is the
             most important control on the page. -->
        <textarea id="sql" spellcheck="false" autocomplete="off"
                  aria-label="متن پرس‌وجوی SQL"
                  placeholder="SELECT ..."></textarea>
        <p class="hint-sql">
          فقط یک دستور <code>SELECT</code> (یا <code>WITH</code>). برای پیوند
          چند جدول، همان <code>JOIN</code> را در همین پرس‌وجو بنویسید.
          <kbd>Ctrl</kbd>+<kbd>Enter</kbd> اجرا می‌کند.
          برای فیلتر، در پرس‌وجو <code>@نام</code> بنویسید، مثل
          <code>WHERE STATUS LIKE @status</code>، و بعد پایین همین کارت آن را
          تعریف کنید.
        </p>

        <!-- The filters. Empty until the query names one, because an empty
             panel with a heading on a page that already has five of them is
             just noise. -->
        <div id="paramsWrap" hidden>
          <div class="runbar" style="margin-top:var(--s4)">
            <b style="font-size:13px">فیلترها</b>
            <span class="hint" id="paramsCount" style="margin:0"></span>
            <span class="spacer"></span>
            <button class="btn btn-sm" type="button" id="paramsSync">
              خواندن از پرس‌وجو
            </button>
          </div>
          <div class="params" id="paramsBox"></div>
        </div>

        <div class="runbar">
          <button class="btn btn-primary" id="runBtn">اجرا</button>
          <button class="btn" id="saveBtn">ذخیره به‌عنوان گزارش</button>
          <span class="spacer"></span>
          <label class="hint" style="margin:0">ردیف در صفحه
            <!-- A minimum width, because "auto" sizes to the Latin digits and
                 the Persian face substitutes wider glyphs for them, which
                 clipped the leading digit of 100. -->
            <select class="select" id="perPage"
                    style="width:auto;min-width:5.5rem;display:inline-block">
              <option>50</option><option selected>100</option><option>250</option><option>500</option>
            </select>
          </label>
        </div>
        <div id="sqlErr"></div>

        <!-- The chart settings. Hidden until a query has run, because every
             control in here is a choice between the columns that came back --
             offering them before there is a result means offering an empty
             list, which reads as a broken feature rather than a sequence. -->
        <div id="chartWrap" hidden>
          <div class="runbar" style="margin-top:var(--s4)">
            <b style="font-size:13px">نمودار</b>
            <span class="hint" id="chartState" style="margin:0"></span>
            <span class="spacer"></span>
            <button class="btn btn-sm" type="button" id="chartNone">بدون نمودار</button>
          </div>
          <p class="grec" id="chartRec"></p>
          <div class="gallery" id="chartGallery"></div>
          <div class="crow" id="chartRow"></div>
          <p class="phint" id="chartHint"></p>
        </div>

        <!-- What the columns are called. Hidden until a query has run, since
             every row in here is one column of the result. -->
        <div id="colsWrap" hidden>
          <div class="runbar" style="margin-top:var(--s4)">
            <b style="font-size:13px">نام ستون‌ها</b>
            <span class="hint" id="colsState" style="margin:0"></span>
          </div>
          <div class="colgrid" id="colsGrid"></div>
          <p class="phint">
            اگر پرس‌وجو خودش با <code>AS «عنوان»</code> نامی گذاشته باشد، همان نام
            می‌ماند. برای ستون‌های دیگر عنوانی بنویسید تا خواننده به‌جای نام فنی
            ستون، آن را ببیند. ستون پنهان در جدول و فایل CSV نمی‌آید، اما مقدارش
            برای نمودار و جزئیات همچنان در دسترس است.
          </p>
        </div>

        <!-- Master and detail: a second query, run for one row of the first.
             Hidden until a query has run, because the key has to be chosen
             from the columns that came back. -->
        <div id="detailWrap" hidden>
          <div class="runbar" style="margin-top:var(--s4)">
            <b style="font-size:13px">جزئیات هر ردیف</b>
            <span class="hint" id="detailState" style="margin:0"></span>
          </div>
          <div class="crow" id="detailRow"></div>
          <label style="display:block;margin-top:var(--s3)">پرس‌وجوی جزئیات (باید
            <code>@key</code> را به‌کار ببرد)
            <textarea class="input" id="detailSQL" spellcheck="false" autocomplete="off"
                      placeholder="SELECT ... WHERE order_no = @key"></textarea>
          </label>
          <p class="phint">
            یک <code>SELECT</code> دیگر که برای ردیفِ کلیک‌شده اجرا می‌شود.
            <code>@key</code> مقدار «ستون کلید» همان ردیف است. فیلترهای همین
            گزارش هم در دسترس‌اند. خالی گذاشتن یعنی بدون جزئیات.
          </p>
        </div>

        <!-- The drawing, above the table. -->
        <div class="chartbox" id="chartBox" hidden>
          <div class="chartwin"><canvas id="chartCanvas"></canvas></div>
          <p class="chartfoot" id="chartFoot"></p>
          <p class="chartwarn" id="chartWarn" hidden></p>
        </div>

        <div class="resbox" id="resBox"></div>
      </div>
    </section>
  </div>

  <!-- Saved. -->
  <section class="card">
    <h2 class="card-head"><span>گزارش‌های ذخیره‌شده</span></h2>
    <div class="card-body"><div class="repgrid" id="repGrid"></div></div>
  </section>
</template>

<!-- The save dialog: a title and a description, because a list of thirty
     queries called "query" is not a list anybody can use. -->
<dialog class="sheet" id="saveSheet" aria-labelledby="saveSheetTitle">
  <div class="sheet-head">
    <h3 id="saveSheetTitle">ذخیره به‌عنوان گزارش</h3>
    <span class="spacer" style="margin-inline-start:auto"></span>
    <button class="gbtn" type="button" data-close aria-label="بستن">
      <svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <form id="saveForm">
      <label style="display:block">عنوان
        <input class="input" id="repTitle" required maxlength="120">
      </label>
      <label style="display:block;margin-top:var(--s3)">توضیح (اختیاری)
        <input class="input" id="repDesc" maxlength="300"
               placeholder="این گزارش به چه پرسشی جواب می‌دهد؟">
      </label>
      <div class="runbar">
        <button class="btn btn-primary" type="submit">ذخیره</button>
        <button class="btn btn-ghost" type="button" data-close>لغو</button>
        <span class="spacer"></span>
        <span class="hint" id="saveMsg" style="margin:0"></span>
      </div>
    </form>
  </div>
</dialog>

<script>
'use strict';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const faNum = new Intl.NumberFormat('fa-IR');
// Persian digits with NO grouping and nothing else touched, for strings that
// are not quantities: a year, or a "1405/03" period label.
//
// faNum is wrong for both. It groups, so the year 1404 comes out "۱٬۴۰۴", and
// it cannot take a label with a slash in it at all.
const faDigits = s => String(s ?? '').replace(/[0-9]/g, c =>
  '۰۱۲۳۴۵۶۷۸۹'[+c]);

let me = null;
let DRIVERS = [];
let SOURCES = [];
let SCHEMA = [];       // the tables of the currently read connection
let SCHEMA_FOR = '';   // which connection SCHEMA belongs to
let EDITING = null;    // the saved report being edited, or null for a new one

async function api(path, opts = {}) {
  const r = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if (r.status === 401) { location.replace('/login?next=/builder'); throw new Error('unauthenticated'); }
  return r;
}

// The error from a failed builder call.
//
// These routes answer with the database's own complaint on purpose -- the
// reader is the author, mid-edit, and "unknown column 'x' in field list" is
// the most useful sentence available. So it is shown, not swallowed.
async function errorOf(r) {
  try {
    const d = await r.json();
    return d.error || ('خطای ' + r.status);
  } catch (_) { return 'خطای ' + r.status; }
}

// ------------------------------------------------------------- connections

function renderSources() {
  const box = $('srcList');
  if (!SOURCES.length) {
    box.innerHTML = '<p class="hint" style="margin:0">' +
      'هنوز اتصالی ثبت نشده است. با «اتصال تازه» شروع کنید.</p>';
  } else {
    box.innerHTML = SOURCES.map(s => `
      <div class="srcrow" data-id="${esc(s.id)}">
        <span class="nm">${esc(s.name)}</span>
        <span class="eng">${esc(s.driver_label)}</span>
        <span class="sm">${esc(s.summary)}</span>
        ${s.note ? `<span class="hint" style="margin:0">${esc(s.note)}</span>` : ''}
        <span class="acts">
          <button class="btn btn-sm" data-test="${esc(s.id)}">آزمودن</button>
          <button class="btn btn-sm" data-edit="${esc(s.id)}">ویرایش</button>
          <button class="btn btn-sm btn-ghost" data-del="${esc(s.id)}">حذف</button>
        </span>
      </div>`).join('');
  }

  // The run selector and the schema both follow this list.
  const sel = $('runSource');
  const keep = sel.value;
  sel.innerHTML = SOURCES.length
    ? SOURCES.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')
    : '<option value="">اتصالی نیست</option>';
  if (keep && SOURCES.some(s => s.id === keep)) sel.value = keep;
}

function fillDriverSelect() {
  $('srcDriver').innerHTML = DRIVERS.map(d =>
    `<option value="${esc(d.id)}">${esc(d.label)}</option>`).join('');
  showExample();
}

function showExample() {
  const d = DRIVERS.find(x => x.id === $('srcDriver').value);
  $('srcExample').textContent = d ? d.example : '';
}

function openSourceForm(src) {
  $('srcForm').hidden = false;
  $('srcForm').dataset.id = src ? src.id : '';
  $('srcName').value = src ? src.name : '';
  $('srcNote').value = src ? (src.note || '') : '';
  $('srcDriver').value = src ? src.driver : (DRIVERS[0] && DRIVERS[0].id) || '';
  // Never prefilled, because the server does not send it back. The
  // placeholder says what leaving it empty means, which is the one thing
  // somebody editing a name needs to know.
  $('srcDSN').value = '';
  $('srcDSN').placeholder = src
    ? 'برای نگه‌داشتن رشتهٔ فعلی خالی بگذارید'
    : '';
  $('srcDSN').required = !src;
  showExample();
  $('srcMsg').textContent = '';
  $('srcName').focus();
}

async function loadSources() {
  const d = await (await api('/api/builder/sources')).json();
  DRIVERS = d.drivers || [];
  SOURCES = d.sources || [];
  fillDriverSelect();
  renderSources();
}

// ----------------------------------------------------------------- schema

function renderSchema() {
  const box = $('schemaBox');
  const q = $('schemaFind').value.trim().toLowerCase();
  if (!SCHEMA.length) {
    box.innerHTML = '<p class="hint" style="margin:0">' +
      (SCHEMA_FOR ? 'این اتصال جدولی نشان نداد.' :
        'یک اتصال انتخاب کنید و «خواندن» را بزنید.') + '</p>';
    return;
  }
  // Filtering matches a column name as well as a table name: somebody
  // looking for "CUSTOMER_NAME" does not know which table it is in, which is the
  // whole reason they are searching.
  const shown = q
    ? SCHEMA.filter(t =>
        (t.schema + '.' + t.name).toLowerCase().includes(q) ||
        (t.columns || []).some(c => c.name.toLowerCase().includes(q)))
    : SCHEMA;

  box.innerHTML = shown.slice(0, 400).map((t, i) => {
    const full = t.schema ? t.schema + '.' + t.name : t.name;
    const cols = (t.columns || []).map(c => `
      <div class="col" data-insert="${esc(c.name)}">
        <span>${esc(c.name)}</span>
        <span class="ty">${esc(c.type)}${c.nullable ? '' : ' •'}</span>
      </div>`).join('');
    return `<div>
        <div class="tbl" data-toggle="${i}" data-insert="${esc(full)}">
          ${esc(full)} <span class="k">${t.kind === 'view' ? 'view' : ''}
          ${faNum.format((t.columns || []).length)}</span>
        </div>
        <div class="cols" data-cols="${i}">${cols}</div>
      </div>`;
  }).join('') + (shown.length > 400
    ? `<p class="hint">${faNum.format(shown.length - 400)} جدول دیگر هم هست؛ جست‌وجو کنید.</p>` : '');
}

async function loadSchema() {
  const id = $('runSource').value;
  if (!id) { toast('اول یک اتصال بسازید.', 'bad'); return; }
  const btn = $('schemaBtn');
  btn.disabled = true;
  try {
    const r = await api('/api/builder/schema?source=' + encodeURIComponent(id));
    if (!r.ok) { toast(await errorOf(r), 'bad'); return; }
    const d = await r.json();
    SCHEMA = d.tables || [];
    SCHEMA_FOR = id;
    renderSchema();
  } finally { btn.disabled = false; }
}

// Insert at the cursor rather than appending.
//
// Somebody clicks a column name while the caret is inside a SELECT list, and
// appending it to the end of the query would be useless -- they would have to
// cut and paste it to where they were.
function insertAtCursor(text) {
  const el = $('sql');
  const s = el.selectionStart ?? el.value.length;
  const e = el.selectionEnd ?? s;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  const at = s + text.length;
  el.setSelectionRange(at, at);
  el.focus();
}

// ---------------------------------------------------------------- filters

// The filter types, fetched from the server rather than listed here.
//
// One list, on the server, because the server is what refuses a type it
// cannot run. A copy in this file would drift the first time one is added,
// and the symptom would be an option that saves and then fails.
let KINDS = [];

// PARAMS is the declaration -- what each filter IS. Saved with the report.
// The values people type are read out of the DOM at the moment of a run, not
// held here: a value belongs to one run, not to the report.
let PARAMS = [];

// USED_NAMES is what the server's scanner found in the query. Kept separate
// from PARAMS so a declaration can outlive an edit to the SQL.
let USED_NAMES = [];

const kindOf = id => KINDS.find(k => k.id === id) || KINDS[0] || { id: 'text', label: 'متن', hint: '' };

// sqlServerSelected says whether the chosen connection is the engine that
// cannot do REGEXP, so a type it would refuse is offered disabled and with a
// reason rather than accepted and then rejected on save.
function sqlServerSelected() {
  const src = SOURCES.find(s => s.id === $('runSource').value);
  return !!src && src.driver === 'sqlserver';
}

function paramRow(p, i, used) {
  const k = kindOf(p.kind);
  const mssql = sqlServerSelected();
  const kindOpts = KINDS.map(x => {
    const off = x.mysql_only && mssql;
    return `<option value="${esc(x.id)}"${x.id === p.kind ? ' selected' : ''}` +
      `${off ? ' disabled' : ''}>${esc(x.label)}${off ? ' (فقط MySQL)' : ''}</option>`;
  }).join('');

  // The value control follows the type, because that is the whole difference
  // between these types from the reader's side: a list to pick from, several
  // lines, or one box.
  let valCtl;
  if (p.kind === 'choice') {
    valCtl = `<select class="select" data-val="${i}">
        <option value="">همه</option>
        ${(p.options || []).map(o =>
          `<option value="${esc(o.value)}">${esc(o.label || o.value)}</option>`).join('')}
      </select>`;
  } else if (p.kind === 'anyof') {
    valCtl = `<textarea class="input" data-val="${i}" spellcheck="false"
        placeholder="هر مقدار در یک خط"></textarea>`;
  } else if (p.kind === 'date' && p.calendar !== 'jalali') {
    valCtl = `<input class="input" type="date" data-val="${i}">`;
  } else if (p.kind === 'date') {
    valCtl = `<input class="input" data-val="${i}" placeholder="۱۴۰۴/۰۶/۳۱"
        inputmode="numeric" autocomplete="off">`;
  } else {
    // A box that completes from the column behind it, where the report says
    // which column that is. A native datalist rather than a custom popup:
    // it works with the keyboard, on a phone, and with a screen reader
    // without any of that being reimplemented here.
    const list = p.suggestable ? ` list="sug${i}"` : '';
    valCtl = `<input class="input" data-val="${i}" autocomplete="off"${list}
        placeholder="${p.kind === 'list' ? 'مثل ۱,۲,۳' : 'خالی = بدون فیلتر'}">` +
      (p.suggestable ? `<datalist id="sug${i}"></datalist>` : '');
  }

  return `<div class="prow${used ? '' : ' punused'}" data-row="${i}">
    <span class="pname">@${esc(p.name)}</span>
    <label>عنوانی که خواننده می‌بیند
      <input class="input" data-label="${i}" maxlength="80" value="${esc(p.label || '')}">
    </label>
    <label>نوع
      <select class="select" data-kind="${i}">${kindOpts}</select>
    </label>
    ${p.kind === 'date' ? `<label>تقویم
      <select class="select" data-cal="${i}">
        <option value="gregorian"${p.calendar !== 'jalali' ? ' selected' : ''}>میلادی (ستون تاریخ واقعی)</option>
        <option value="jalali"${p.calendar === 'jalali' ? ' selected' : ''}>شمسی (ستون متنی)</option>
      </select></label>` : ''}
    ${p.kind === 'choice' ? `<div style="grid-column:2 / -1">
      <div class="runbar" style="margin-top:0">
        <span class="hint" style="margin:0">گزینه‌ها: هر خط یک گزینه</span>
        <span class="spacer"></span>
        <!-- The whole point of "no coding": the values are already in the
             result on screen, so offer to read them out rather than asking
             somebody to type four statuses they can see above them. -->
        <select class="select" data-fillfrom="${i}" style="width:auto;min-width:9rem">
          <option value="">پر کردن از ستون…</option>
          ${LAST_RESULT ? columnOptions(LAST_RESULT, '', '') : ''}
        </select>
      </div>
      <textarea class="input" data-opts="${i}" spellcheck="false" placeholder="TO_DO|در جریان"
        >${esc((p.options || []).map(o =>
          o.label && o.label !== o.value ? o.value + '|' + o.label : o.value).join('\n'))}</textarea>
    </div>` : ''}
    <label style="grid-column:2 / -1">پیش‌فرض
      <input class="input" data-def="${i}" value="${esc(p.default || '')}"
             placeholder="اگر خواننده چیزی نگذارد، این به‌کار می‌رود">
    </label>
    ${p.kind === 'choice' || p.kind === 'date' ? '' : `<label style="grid-column:2 / -1">
      پیشنهاد مقدار از این ستون (اختیاری)، مثل <code dir="ltr">customers.name</code>
      <input class="input" data-sug="${i}" autocomplete="off" spellcheck="false"
             dir="ltr" style="text-align:left;font-family:var(--font-latin)"
             value="${esc(p.suggest_table ? p.suggest_table + '.' + p.suggest_column : '')}"
             placeholder="جدول.ستون">
    </label>
    <label style="align-self:center">
      <input type="checkbox" data-sugperson="${i}"${p.suggest_person ? ' checked' : ''}>
      نام افراد است
    </label>`}
    <p class="phint" style="grid-column:1 / -1">${esc(k.hint || '')}</p>
    ${used ? '' : '<p class="pnote">پرس‌وجو دیگر این فیلتر را صدا نمی‌زند، پس اثری ندارد.</p>'}
    <div class="pval">
      <label>مقدار برای این اجرا${valCtl}</label>
    </div>
  </div>`;
}

function renderParams() {
  const wrap = $('paramsWrap');
  wrap.hidden = PARAMS.length === 0;
  if (!PARAMS.length) { $('paramsBox').innerHTML = ''; return; }

  // "Used" is decided against the query as it stands, so a filter left behind
  // by an edit shows as inert instead of quietly doing nothing.
  const inSQL = new Set(USED_NAMES);
  $('paramsCount').textContent = faNum.format(PARAMS.length) + ' فیلتر';
  $('paramsBox').innerHTML =
    PARAMS.map((p, i) => paramRow(p, i, inSQL.has(p.name))).join('');
}

// readDecls pulls the declarations back out of the form.
//
// Read at the moment they are needed rather than on every keystroke: a filter
// is four fields, and an oninput that rebuilt the panel would move the caret
// out from under whoever was typing in it.
function readDecls() {
  const box = $('paramsBox');
  PARAMS = PARAMS.map((p, i) => {
    const get = sel => box.querySelector(`[${sel}="${i}"]`);
    const label = get('data-label'), kind = get('data-kind');
    const def = get('data-def'), cal = get('data-cal'), opts = get('data-opts');
    const sug = get('data-sug'), sugPerson = get('data-sugperson');
    const out = {
      name: p.name,
      label: label ? label.value.trim() : p.label,
      kind: kind ? kind.value : p.kind,
      default: def ? def.value : p.default,
    };
    if (out.kind === 'date') out.calendar = cal ? cal.value : (p.calendar || 'gregorian');

    // "table.column", split here rather than asking for two boxes. One field
    // is what somebody reading the schema tree beside them already has in
    // their head, and the server proves both halves anyway.
    const raw = sug ? sug.value.trim() :
      (p.suggest_table ? p.suggest_table + '.' + p.suggest_column : '');
    if (raw) {
      const dot = raw.lastIndexOf('.');
      if (dot > 0) {
        out.suggest_table = raw.slice(0, dot).trim();
        out.suggest_column = raw.slice(dot + 1).trim();
      } else {
        // Sent as typed so the server explains what is wrong, rather than
        // this quietly dropping it and the box never suggesting anything.
        out.suggest_table = raw;
      }
      out.suggest_person = !!(sugPerson ? sugPerson.checked : p.suggest_person);
    }
    // Carried through so a re-render keeps the box wired to its datalist; the
    // server recomputes it on save.
    out.suggestable = !!(out.suggest_table && out.suggest_column);
    if (out.kind === 'choice') {
      // "value|label" per line, and a line with no bar labels itself -- so
      // listing four statuses does not mean typing each of them twice.
      const text = opts ? opts.value : (p.options || []).map(o => o.value).join('\n');
      out.options = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
        const bar = l.indexOf('|');
        return bar < 0 ? { value: l, label: l }
          : { value: l.slice(0, bar).trim(), label: l.slice(bar + 1).trim() };
      });
    }
    return out;
  });
  return PARAMS;
}

// fillOptionsFrom writes a column's distinct values into a dropdown filter's
// options list.
//
// The values are read from the result already on screen, not queried. That is
// the honest limit and it is stated: what it can offer is what this page of
// the result holds. For a status or a method column -- the ones a dropdown is
// for -- that is every value there is, and the alternative was asking somebody
// to type them out while looking at them in the table below.
//
// It appends rather than replaces, so a list somebody has already curated is
// added to rather than thrown away, and repeats are dropped.
function fillOptionsFrom(sel) {
  const i = sel.dataset.fillfrom;
  const col = sel.value;
  sel.value = '';
  if (!col || !LAST_RESULT) return;

  const ci = LAST_RESULT.columns.indexOf(col);
  if (ci < 0) return;

  const box = $('paramsBox').querySelector(`[data-opts="${i}"]`);
  if (!box) return;

  const have = new Set(box.value.split('\n')
    .map(l => l.split('|')[0].trim()).filter(Boolean));
  const added = [];
  for (const row of LAST_RESULT.rows) {
    const v = row[ci];
    if (v === null || v === undefined) continue;
    const s = String(v).trim();
    if (!s || have.has(s)) continue;
    have.add(s);
    added.push(s);
  }
  if (!added.length) { toast('این ستون مقدار تازه‌ای نداشت.', 'bad'); return; }

  added.sort((a, b) => a.localeCompare(b, 'fa'));
  const existing = box.value.trim();
  box.value = (existing ? existing + '\n' : '') + added.join('\n');
  readDecls();
  toast(faNum.format(added.length) + ' گزینه از «' +
    headingFor(LAST_RESULT, ci) + '» اضافه شد.');
}

// Completions for a filter box, from the column the report names.
//
// Debounced, and the server caches the column for ten minutes -- so a burst
// of typing is one round trip rather than one per character, and a second
// burst is none at all. Failures are silent by design: a box that cannot
// complete should still be a working text field, not a red message under
// something somebody is mid-word in.
let sugTimer = null;
function suggestFor(el) {
  const i = el.dataset.val;
  const p = PARAMS[i];
  if (!p || !p.suggest_table || !p.suggest_column) return;
  const list = $('sug' + i);
  if (!list) return;

  clearTimeout(sugTimer);
  const typed = el.value;
  sugTimer = setTimeout(async () => {
    const q = new URLSearchParams({
      source: $('runSource').value,
      table: p.suggest_table, column: p.suggest_column,
      person: p.suggest_person ? '1' : '0',
      q: typed,
    });
    try {
      const r = await api('/api/builder/suggest?' + q.toString());
      if (!r.ok) return;
      const d = await r.json();
      list.innerHTML = (d.values || [])
        .map(v => `<option value="${esc(v)}"></option>`).join('');
    } catch (e) { /* a text field that does not complete is still a text field */ }
  }, 220);
}

// paramValues is what the reader chose, by name. Blank is left out entirely
// rather than sent as "", so the server applies the default -- which is what
// makes an empty box mean "no filter" instead of "match nothing".
function paramValues() {
  const box = $('paramsBox');
  const out = {};
  PARAMS.forEach((p, i) => {
    const el = box.querySelector(`[data-val="${i}"]`);
    if (!el) return;
    const v = el.value.trim();
    if (v) out[p.name] = v;
  });
  return out;
}

// syncParams asks the server which filters the query declares, and reconciles.
//
// Additive: a placeholder with no row gets one, and a row whose placeholder
// has gone is kept but marked inert. Deleting it would throw away a label
// somebody wrote because they had not finished typing the WHERE clause yet.
async function syncParams(quiet) {
  const sql = $('sql').value;
  let d;
  try {
    const r = await api('/api/builder/params', {
      method: 'POST', body: JSON.stringify({ sql }),
    });
    if (!r.ok) return;
    d = await r.json();
  } catch (e) { return; }

  KINDS = d.kinds || KINDS;
  CHART_KINDS = d.charts || CHART_KINDS;
  CHART_AGGS = d.chartAggs || CHART_AGGS;
  CHART_BUCKETS = d.chartBuckets || CHART_BUCKETS;
  CHART_COMPARES = d.chartCompares || CHART_COMPARES;
  USED_NAMES = d.names || [];

  // The type each placeholder's own clause implies. A new row starts as that
  // rather than as plain text: a placeholder against LIKE bound as text binds
  // "" instead of "%", which matches only the rows whose column is empty --
  // three of twenty-eight on the live data, which reads as a broken report.
  const suggested = new Map((d.found || []).map(f => [f.name, f.kind]));

  const have = new Map(readDecls().map(p => [p.name, p]));
  const added = [];
  // Query order first, so the boxes appear in the order the query reads.
  const next = USED_NAMES.map(n => {
    if (have.has(n)) { const p = have.get(n); have.delete(n); return p; }
    added.push(n);
    return { name: n, label: '', kind: suggested.get(n) || 'text', default: '' };
  });
  // Then whatever is declared but no longer used, kept at the end.
  for (const p of have.values()) next.push(p);

  PARAMS = next;
  renderParams();
  if (!quiet && added.length) {
    toast(added.map(n => '@' + n).join('، ') + ' به فیلترها اضافه شد.');
  }
}

// ------------------------------------------------------------------ chart

let CHART_KINDS = [];
let CHART_AGGS = [];
let CHART_BUCKETS = [];
let CHART_COMPARES = [];
// CHART is the report's chart, or null for a table only -- which is most of
// them. Held here and saved with the report; the drawing itself is rebuilt
// from the rows on every run.
let CHART = null;
let LAST_RESULT = null;
let chartObj = null;

const chartKindOf = id => CHART_KINDS.find(k => k.id === id) || null;
const chartAggOf = id => CHART_AGGS.find(a => a.id === id) || CHART_AGGS[0] || null;

// toNumber reads a number out of whatever the column actually holds.
//
// Not parseFloat, and this is not defensiveness: in many databases the
// money columns are formatted STRINGS, mixing
// currencies and thousands separators ("۱٫۲۰۰٬۰۰۰ ریال", "12.964 دلار",
// "1,234.56"), and several numeric-looking columns are VARCHAR. parseFloat on
// any of those returns NaN or, worse, a truncated number: parseFloat("1,234")
// is 1, so a chart would quietly plot a thousandth of the real figure.
//
// So: Persian and Arabic-Indic digits are folded to ASCII, the Arabic decimal
// and thousands marks are translated, and the separators are resolved by
// position rather than by assuming a locale -- whichever of "." or "," appears
// LAST is the decimal one, which reads both "1,234.56" and "1.234,56"
// correctly. Anything with no digit in it at all returns null, and the caller
// counts those rather than treating them as zero.
function toNumber(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  let s = String(v);

  // Digits first, so the separator logic below sees ASCII.
  s = s.replace(/[۰-۹]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x06F0 + 48))
       .replace(/[٠-٩]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x0660 + 48))
       .replace(/٫/g, '.')   // Arabic decimal separator
       .replace(/٬/g, ',');  // Arabic thousands separator

  if (!/[0-9]/.test(s)) return null;

  // A date or a time is not a quantity, and this is the case that made the
  // check necessary: almost every date column in this database holds a Jalali
  // date as TEXT ("1405/04/10"). Stripping its separators the way the code
  // below strips a currency symbol leaves "14050410", which plots happily as
  // fourteen million and is the worst kind of wrong -- a chart that is drawn,
  // is wrong, and says nothing about it. Refusing means the value is counted
  // as unreadable and the reader is told.
  if (/[0-9][\/:][0-9]/.test(s) || /[0-9]-[0-9]/.test(s)) return null;

  const neg = /^\s*[-(]/.test(s);
  const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
  if (lastDot >= 0 && lastComma >= 0) {
    // Both present: the later one is the decimal point, the earlier is
    // grouping. Removing the wrong one turns 1.234,56 into 123456.
    const dec = lastDot > lastComma ? '.' : ',';
    const grp = dec === '.' ? ',' : '.';
    s = s.split(grp).join('').replace(dec, '.');
  } else if (lastComma >= 0) {
    // One kind only. Three digits after it is grouping ("1,234"); anything
    // else is a decimal comma ("1,5").
    s = /,[0-9]{3}(?![0-9])/.test(s) ? s.split(',').join('') : s.replace(',', '.');
  }

  s = s.replace(/[^0-9.]/g, '');
  // A stray second dot (a date, say) would make parseFloat stop early and
  // return a number that is not the value -- refuse rather than mislead.
  if ((s.match(/\./g) || []).length > 1) return null;
  const n = parseFloat(s);
  if (!Number.isFinite(n)) return null;
  return neg ? -n : n;
}

// bucketLabel groups a date label to its month or year.
//
// String truncation, not date arithmetic, and that is the right tool here:
// the date columns in this database are TEXT holding a Jalali date
// ("1404/03/12"), whose month is its first seven characters. Converting to a
// calendar and back would need a Jalali library to produce the same answer
// this produces by taking a substring -- which is exactly why the shipped
// reports group these columns as strings too.
//
// Only a value that LOOKS like a date is touched. A label of "WGL" under a
// month grouping is left alone rather than truncated to "WGL", because a
// grouping applied to the wrong column should draw a recognisably odd chart
// rather than a plausible one built from fragments of names.
function bucketLabel(v, bucket) {
  if (!bucket) return v;
  const s = v.trim();
  // yyyy/mm/dd or yyyy-mm-dd, either calendar -- the shapes these columns use.
  const m = /^(\d{4})[-\/](\d{1,2})(?:[-\/](\d{1,2}))?/.exec(s);
  if (!m) return v;
  if (bucket === 'year') return m[1];
  if (bucket === 'month') return m[1] + '/' + m[2].padStart(2, '0');
  // The day grouping truncates nothing -- it PADS, so that "1404/3/5" and
  // "1404/03/05" are one category rather than two, which is what a raw date
  // column gives you ungrouped. It is also the grouping a month-on-month
  // comparison needs, since it is the only one that leaves the day in.
  if (bucket === 'day') {
    return m[3] ? m[1] + '/' + m[2].padStart(2, '0') + '/' + m[3].padStart(2, '0')
                : m[1] + '/' + m[2].padStart(2, '0');
  }
  return v;
}

// splitPeriod cuts a bucketed date label into the period and the position
// within it.
//
// "1405/03" under a year-on-year comparison is the period 1405 at position 03,
// which is why that mode is paired with the MONTH grouping: it is the grouping
// that leaves the month in the label. Month-on-month is paired with the DAY
// grouping for the same reason, and given "1405/03" -- a date whose column
// holds no day -- it returns null rather than guessing one. The reader is then
// told the column has no day in it, which is the truth and is actionable;
// inventing a day would draw one point per period and look like an answer.
function splitPeriod(label, compare) {
  const m = /^(\d{4})\/(\d{1,2})(?:\/(\d{1,2}))?$/.exec(String(label).trim());
  if (!m) return null;
  if (compare === 'year') {
    return { period: m[1], at: m[2].padStart(2, '0') };
  }
  if (compare === 'month') {
    if (!m[3]) return null;  // a month label carries no day
    return { period: m[1] + '/' + m[2].padStart(2, '0'), at: m[3].padStart(2, '0') };
  }
  return null;
}

// comparePeriods regroups one continuous series into one series per period.
//
// The management question -- "how does this month compare with last" -- asked
// of data already on screen. A single line running across two years answers
// "what happened"; two lines over the same twelve months answer "is it better
// or worse", which is the question actually being asked.
//
// Done by REGROUPING the rows already fetched, not by running the query again.
// Two runs are two answers taken a moment apart against a database somebody
// else is writing to, and the totals would not reconcile with the table below.
//
// Returns null when the data cannot support it, with the reason, so the page
// can say why instead of drawing one line and calling it a comparison.
function comparePeriods(d, spec) {
  if (!spec.compare || d.points || d.distribution) return null;

  // Every label has to be splittable, or the axis would mix "03" with
  // "Kara Post" and the chart would be nonsense.
  //
  // Two different failures, told apart because they have two different fixes:
  // a label that is not a date at all means the wrong column is being
  // grouped, while a date with no day in it means the column holds months and
  // there is nothing finer to compare. Reporting both as one would send the
  // reader to change the column when the column is right.
  const split = d.labels.map(l => splitPeriod(l, spec.compare));
  if (split.some(s => !s)) {
    const anyDate = d.labels.some(l => /^\d{4}\/\d{1,2}(\/\d{1,2})?$/.test(String(l).trim()));
    if (!anyDate) {
      return { no: 'برچسب‌ها تاریخ نیستند؛ ستون برچسب را روی یک ستون تاریخ بگذارید.' };
    }
    return { no: spec.compare === 'month'
      ? 'این ستون تاریخ فقط ماه دارد و روز ندارد، پس ماه‌ها قابل مقایسه نیستند؛ ' +
        'برای مقایسهٔ سال با سال گروه‌بندی را روی «ماه» بگذارید.'
      : 'بعضی برچسب‌ها تاریخ کامل نیستند.' };
  }

  // The positions become the axis, in order; the periods become the series,
  // oldest first so the legend reads the way a comparison is spoken --
  // "1404 against 1405".
  const positions = [...new Set(split.map(s => s.at))].sort();
  const periods = [...new Set(split.map(s => s.period))].sort();
  if (periods.length < 2) {
    return { no: 'برای مقایسه به دو دورهٔ کامل نیاز است؛ ' +
      'بازهٔ پرس‌وجو را بازتر کنید.' };
  }

  // One series per period per plotted column. With one column that is the
  // usual two lines; with two it is four, which is legible but is the point
  // at which a reader should probably plot one thing at a time.
  const series = [];
  for (const s of d.series) {
    for (const period of periods) {
      const byPosition = new Map();
      split.forEach((sp, i) => {
        if (sp.period === period) byPosition.set(sp.at, s.data[i]);
      });
      series.push({
        name: d.series.length > 1 ? `${s.name}، ${period}` : period,
        // A period with no row at a position is a GAP, not a zero: the year
        // has not reached that month yet, and a line dropping to nought would
        // read as "we sold nothing".
        data: positions.map(p => byPosition.has(p) ? byPosition.get(p) : null),
      });
    }
  }
  return { labels: positions, series, periods };
}

// The series colours. The accent first, so a single-series chart is in the
// page's own colour rather than Chart.js's default blue.
const CHART_COLOURS = ['#E5641D', '#5FB89F', '#E0B15C', '#7FA9D9', '#D9566F',
                       '#A98BD1', '#6FC4AB', '#E5BA6B'];

// chartData folds the result into labels and series.
//
// Returns what could not be read as well as what could, so the page can say
// so. A chart drawn from half a column with no mention of the other half is
// the most expensive kind of wrong.
// scatterData turns rows into points, one per row.
//
// No grouping at all: one point per row IS the chart, and folding by the x
// value would collapse the cloud this exists to show into a single point per
// x. The label column is the horizontal axis and has to be a number; a row
// where either side cannot be read is dropped and counted, because a point
// drawn at a guessed coordinate is worse than a point missing.
function scatterData(res, spec) {
  const xi = res.columns.indexOf(spec.label);
  const yName = (spec.values || [])[0];
  const yi = yName ? res.columns.indexOf(yName) : -1;
  const missing = [];
  if (xi < 0) missing.push(spec.label);
  if (yName && yi < 0) missing.push(yName);
  if (xi < 0 || yi < 0) {
    return { missing, points: true, labels: [], series: [], unreadable: 0, rows: 0 };
  }

  const pts = [];
  let unreadable = 0;
  for (const row of res.rows) {
    const x = toNumber(row[xi]), y = toNumber(row[yi]);
    if (x === null || y === null) { unreadable++; continue; }
    pts.push({ x, y });
  }
  return {
    missing, points: true, labels: [],
    series: [{ name: yName + ' / ' + spec.label, data: pts }],
    unreadable, rows: res.rows.length,
  };
}

// histData divides one numeric column into equal ranges and counts each.
//
// The answer to "what do most of these weigh", which no per-category chart
// can give. Equal-width ranges over the observed minimum and maximum, because
// the alternative -- equal-count quantiles -- draws bars of identical height
// and shows nothing.
function histData(res, spec) {
  const name = (spec.values || [])[0];
  const ci = name ? res.columns.indexOf(name) : -1;
  if (ci < 0) {
    return { missing: name ? [name] : [], labels: [], series: [], unreadable: 0, rows: 0 };
  }

  const nums = [];
  let unreadable = 0;
  for (const row of res.rows) {
    const n = toNumber(row[ci]);
    if (n === null) { if (row[ci] !== null && row[ci] !== '') unreadable++; continue; }
    nums.push(n);
  }
  if (!nums.length) {
    return { missing: [], labels: [], series: [], unreadable, rows: res.rows.length };
  }

  const lo = Math.min(...nums), hi = Math.max(...nums);

  // Every value identical is ONE range holding everything, not the requested
  // number of ranges starting at that value.
  //
  // Measured: three rows all reading 7, asked for five ranges, came out as
  // "7.0 – 8.0" with a count of three followed by four empty ranges up to
  // "11 – 12". Four of those ranges are invented -- nothing in the data
  // reaches 12 -- and the chart says the values are spread when they are not.
  if (!(hi > lo)) {
    return {
      missing: [], labels: [fmtBinEdge(lo)],
      series: [{ name: 'تعداد', data: [nums.length] }],
      unreadable, rows: res.rows.length, distribution: true, single: true,
    };
  }

  const bins = Math.max(3, Math.min(60, spec.bins || 12));
  const width = (hi - lo) / bins;
  const counts = new Array(bins).fill(0);
  for (const n of nums) {
    // The top value belongs in the last range, not a range of its own past
    // the end.
    let k = hi > lo ? Math.floor((n - lo) / width) : 0;
    if (k >= bins) k = bins - 1;
    if (k < 0) k = 0;
    counts[k]++;
  }

  const labels = counts.map((_, k) => {
    const a = lo + k * width, b = a + width;
    return fmtBinEdge(a) + ' تا ' + fmtBinEdge(b);
  });
  return {
    missing: [], labels,
    series: [{ name: 'تعداد', data: counts }],
    unreadable, rows: res.rows.length, distribution: true,
  };
}

// countNonPositive is how many plotted numbers a logarithmic axis cannot show.
//
// A logarithm is undefined at nought and below, and Chart.js does not say so:
// asked to draw [-5, 10, 0, 100] on a logarithmic axis it produced an axis
// starting at 1 and drew TWO bars, silently. A chart missing half its data
// with nothing on screen to say which half is the worst thing in this file,
// so the count is carried out and reported.
function countNonPositive(d) {
  let n = 0;
  for (const s of d.series || []) {
    for (const v of s.data || []) {
      const num = (v && typeof v === 'object') ? v.y : v;
      if (num !== null && num !== undefined && Number(num) <= 0) n++;
    }
  }
  return n;
}

// fmtBinEdge keeps a range label short enough to read on an axis.
function fmtBinEdge(v) {
  const a = Math.abs(v);
  if (a >= 1000) return Math.round(v).toLocaleString('en-US');
  if (a >= 10) return v.toFixed(0);
  if (a >= 1) return v.toFixed(1);
  return v.toFixed(2);
}

function chartData(res, spec) {
  const kind = chartKindOf(spec.kind) || {};
  if (kind.bins) return histData(res, spec);
  if (kind.numeric_label) return scatterData(res, spec);

  const li = res.columns.indexOf(spec.label);
  const missing = [];
  if (li < 0) missing.push(spec.label);
  const vi = (spec.values || []).map(name => {
    const i = res.columns.indexOf(name);
    if (i < 0) missing.push(name);
    return { name, i };
  }).filter(c => c.i >= 0);

  if (li < 0 || (spec.agg !== 'count' && !vi.length)) {
    return { missing, labels: [], series: [], unreadable: 0, rows: 0 };
  }

  // Insertion order, which is the query's own ORDER BY. Sorting here would
  // silently override an ORDER BY the author wrote on purpose.
  const groups = new Map();
  let unreadable = 0;
  // Whether ANY number was read at all. A column of pure text folds to a row
  // of zeroes, which draws as a set of flat bars -- a chart that looks like
  // "everything is nought" rather than "this column holds no numbers".
  let readAny = false;
  for (const row of res.rows) {
    const key = row[li] === null || row[li] === ''
      ? '—' : bucketLabel(String(row[li]), spec.bucket);
    let g = groups.get(key);
    if (!g) { g = { n: 0, sums: vi.map(() => 0), seen: vi.map(() => 0) }; groups.set(key, g); }
    g.n++;
    vi.forEach((c, k) => {
      const num = toNumber(row[c.i]);
      if (num === null) { if (row[c.i] !== null && row[c.i] !== '') unreadable++; return; }
      readAny = true;
      g.sums[k] += num;
      g.seen[k]++;
    });
  }

  let labels = [...groups.keys()];

  // Insertion order is the query's own ORDER BY, and overriding it would throw
  // away a decision the author made -- so raw labels are left exactly as they
  // arrived.
  //
  // Bucketed labels are different: "1405/03" was computed here, not chosen by
  // anybody, and a query with no ORDER BY on its date column produced
  // 04, 05, 03, 06 in that order. A trend line through those months is not a
  // trend, it is a zigzag that looks like one -- the worst kind of chart.
  // Zero-padded year/month sorts correctly as text, in either calendar, which
  // is the same property that makes the truncation work at all.
  if (spec.bucket) {
    labels.sort((a, b) => {
      // The empty category last, wherever it fell: it is not a date and has no
      // place in the middle of a timeline.
      if (a === '—') return 1;
      if (b === '—') return -1;
      return a < b ? -1 : a > b ? 1 : 0;
    });
  }
  let series;
  if (spec.agg === 'count') {
    series = [{ name: 'تعداد ردیف', data: labels.map(l => groups.get(l).n) }];
  } else {
    series = vi.map((c, k) => ({
      name: c.name,
      data: labels.map(l => {
        const g = groups.get(l);
        if (spec.agg === 'avg') return g.seen[k] ? g.sums[k] / g.seen[k] : null;
        // "none" still folds rows that share a label -- there is only one bar
        // per label on a category axis, so summing them is the only honest
        // reading. Where labels are unique, which is what "none" is for, a sum
        // of one row is that row.
        return g.sums[k];
      }),
    }));
  }
  // A percentage-stacked chart shows the MIX within each category, so each
  // category's columns are rescaled to add to a hundred.
  //
  // Done here rather than by Chart.js, which has no such stacking mode: the
  // numbers themselves become percentages, which also means the tooltip and
  // the axis agree about what they are. A category whose columns total zero is
  // left at zero rather than divided by it -- there is no mix to show.
  if (spec.kind === 'sbar' && series.length) {
    const totals = labels.map((_, i) =>
      series.reduce((sum, s) => sum + (Number(s.data[i]) || 0), 0));
    series = series.map(s => ({
      name: s.name,
      data: s.data.map((v, i) => totals[i] ? (Number(v) || 0) / totals[i] * 100 : 0),
    }));
  }

  const out = { missing, labels, series, unreadable, rows: res.rows.length,
    percent: spec.kind === 'sbar',
    // Counting rows needs no numbers, so it is never "no numbers read".
    noNumbers: spec.agg !== 'count' && !readAny && res.rows.length > 0 };

  // The comparison goes LAST, on the aggregated series: it regroups totals
  // that are already correct rather than changing how they were computed.
  // Doing it earlier would mean aggregating twice and having to keep the two
  // in step.
  if (spec.compare) {
    const cmp = comparePeriods(out, spec);
    if (cmp && cmp.no) {
      out.compareNote = cmp.no;
    } else if (cmp) {
      out.labels = cmp.labels;
      out.series = cmp.series;
      out.compared = cmp.periods;
    }
  }
  return out;
}

let chartLibReady = null;
function loadChartLib() {
  if (chartLibReady) return chartLibReady;
  chartLibReady = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = '/vendor/chart.umd.min.js';
    el.onload = () => {
      // Chart.js ships its own font family and never inherits the canvas's,
      // so every Persian label would be drawn in a Latin face. That is not
      // only ugly: a Latin face does not mirror bracket pairs in a
      // right-to-left run, so a label like «وزن (کیلوگرم)» comes out with its
      // parentheses swapped. The same fix, for the same reason, as the
      // reports page.
      const fam = getComputedStyle(document.body).fontFamily;
      if (fam) Chart.defaults.font.family = fam.replace(/\s+/g, ' ');
      // And its own default text colour, #666, which on this dark ground is
      // near-black on near-black.
      Chart.defaults.color = '#ffffff';
      Chart.defaults.borderColor = 'rgba(255,255,255,.14)';
      Chart.defaults.plugins.legend.labels.color = '#ffffff';
      Chart.defaults.plugins.tooltip.titleColor = '#ffffff';
      Chart.defaults.plugins.tooltip.bodyColor = '#ffffff';
      resolve();
    };
    el.onerror = () => reject(new Error('chart library did not load'));
    document.head.appendChild(el);
  });
  chartLibReady.catch(() => { chartLibReady = null; });
  return chartLibReady;
}

// --------------------------------------------------- knowing the data

// profileColumns measures what each column of a result actually holds.
//
// This is what makes the chart picker something other than a list of names:
// every question below -- can this be plotted, is it a date, is it a category
// or a reference number -- is answered from the rows on screen rather than
// from the column's declared type, which in this database is VARCHAR for
// almost everything and therefore says nothing.
//
// Sampled rather than exhaustive above a few hundred rows: the answers are
// proportions and a sample settles them, and this runs on every result.
function profileColumns(res) {
  if (!res || !res.columns) return [];
  const rows = res.rows || [];
  const step = Math.max(1, Math.floor(rows.length / 300));

  return res.columns.map((name, i) => {
    let seen = 0, numeric = 0, dated = 0, blank = 0;
    const distinct = new Set();
    for (let r = 0; r < rows.length; r += step) {
      const v = rows[r][i];
      if (v === null || v === undefined || String(v).trim() === '') { blank++; continue; }
      seen++;
      const s = String(v);
      if (distinct.size < 200) distinct.add(s);
      if (toNumber(v) !== null) numeric++;
      if (/^\d{4}[-\/]\d{1,2}([-\/]\d{1,2})?/.test(s.trim())) dated++;
    }
    return {
      name, index: i, seen, blank,
      distinct: distinct.size,
      // Fractions, so a column of mostly-numbers with one stray note still
      // counts as plottable.
      numeric: seen ? numeric / seen : 0,
      dated: seen ? dated / seen : 0,
      hidden: !!(res.hidden && res.hidden[i]),
      heading: headingFor(res, i),
    };
  });
}

// A column is worth plotting if most of its values are numbers, and worth
// grouping by if it has few enough distinct values to make readable
// categories. The thresholds are what this data needs: 0.7 because a weight
// column with a couple of notes in it is still a weight column, and 40
// categories because beyond that a bar chart is a barcode.
const PLOTTABLE = 0.7;
const DATEISH = 0.7;
const MAX_CATEGORIES = 40;

const isNumericCol = p => p.numeric >= PLOTTABLE && p.seen > 0;
const isDateCol = p => p.dated >= DATEISH && p.seen > 0;
const isCategoryCol = p =>
  p.seen > 0 && p.distinct > 1 && p.distinct <= MAX_CATEGORIES && !isNumericCol(p);

// pickColumns proposes the columns one kind should use for this result.
//
// Returns null when the kind cannot be drawn from this result at all, with the
// reason -- which the gallery shows on the dimmed tile, so "why can I not
// choose a scatter" is answered before it is asked.
function pickColumns(kind, prof) {
  const nums = prof.filter(isNumericCol);
  const dates = prof.filter(isDateCol);
  // Fewest distinct values first: the most readable category axis.
  const cats = prof.filter(isCategoryCol).sort((a, b) => a.distinct - b.distinct);
  // A date column is a fine category too, once bucketed.
  const anyCat = cats.length ? cats : dates;

  switch (kind) {
    case 'hist':
      if (!nums.length) return { no: 'ستون عددی ندارد' };
      return { values: [nums[0].name], bins: 12 };

    case 'scatter':
      if (nums.length < 2) return { no: 'به دو ستون عددی نیاز دارد' };
      return { label: nums[0].name, values: [nums[1].name] };

    case 'line': case 'area': {
      const axis = dates[0] || anyCat[0];
      if (!axis) return { no: 'ستون تاریخ یا دسته ندارد' };
      const v = nums.filter(n => n.name !== axis.name);
      return {
        label: axis.name,
        bucket: isDateCol(axis) ? 'month' : '',
        ...(v.length ? { values: [v[0].name], agg: 'sum' } : { values: [], agg: 'count' }),
      };
    }

    case 'sbar': case 'mixed': case 'radar': {
      if (!anyCat.length) return { no: 'ستون دسته ندارد' };
      const label = anyCat[0];
      const v = nums.filter(n => n.name !== label.name);
      if (v.length < 2) return { no: 'به دو ستون عددی نیاز دارد' };
      return { label: label.name, values: [v[0].name, v[1].name],
               agg: kind === 'radar' ? 'avg' : 'sum' };
    }

    default: {
      // bar, hbar, pie, doughnut, polar: one category, one number -- or a
      // count of rows where there is no number to add up, which is a
      // perfectly good chart.
      if (!anyCat.length) return { no: 'ستون دسته ندارد' };
      const label = anyCat[0];
      const v = nums.filter(n => n.name !== label.name);
      return {
        label: label.name,
        bucket: isDateCol(label) ? 'month' : '',
        ...(v.length ? { values: [v[0].name], agg: 'sum' } : { values: [], agg: 'count' }),
      };
    }
  }
}

// specFor builds a complete, drawable spec for one kind from this result.
function specFor(kind, prof, keepTitle) {
  const picked = pickColumns(kind, prof);
  if (picked.no) return { no: picked.no };
  return {
    kind, label: '', values: [], agg: 'sum', bucket: '',
    stacked: false, log_scale: false, bins: 0,
    title: keepTitle || '',
    ...picked,
  };
}

// recommend proposes the chart this result most wants.
//
// Ordered by what the data supports rather than by preference: a result with a
// date column is asking to be a trend, one with two numbers and no category is
// asking to be a scatter, and anything with a category and a number is a bar --
// which is most of them, and is why bar is the fallback rather than the first
// guess.
function recommend(prof) {
  const nums = prof.filter(isNumericCol);
  const dates = prof.filter(isDateCol);
  const cats = prof.filter(isCategoryCol);

  if (dates.length && (nums.length || cats.length)) {
    return { kind: 'line', why: 'ستون تاریخ دارد، پس روند در طول زمان' };
  }
  if (cats.length && nums.length >= 2) {
    return { kind: 'mixed', why: 'یک دسته و دو عدد دارد، پس میله و خط با هم' };
  }
  if (cats.length && nums.length) {
    return { kind: 'bar', why: 'یک دسته و یک عدد دارد' };
  }
  if (cats.length) {
    return { kind: 'bar', why: 'دسته دارد ولی عددی برای جمع زدن نیست، پس تعداد ردیف' };
  }
  if (nums.length >= 2) {
    return { kind: 'scatter', why: 'دو ستون عددی دارد، پس رابطهٔ آن دو' };
  }
  if (nums.length) {
    return { kind: 'hist', why: 'یک ستون عددی دارد، پس توزیع آن' };
  }
  return null;
}

// chartConfig builds the Chart.js configuration for one kind.
//
// One function for all twelve, and one function shared with the gallery of
// previews -- so what somebody picks from the gallery is drawn by the same
// code that draws it afterwards. Two builders would let the preview promise
// something the chart does not deliver, which is the whole value of having a
// preview taken away.
//
// small is the gallery's version: no legend, no axis labels, no animation. The
// DATA is identical; only the furniture is dropped, because at 150 pixels the
// furniture is all you would see.
function chartConfig(d, spec, small) {
  const kind = spec.kind;
  const info = chartKindOf(kind) || {};
  // Three groups, and the distinction is not cosmetic -- it decides which
  // scales the configuration may mention at all.
  //
  //   sliced   pie, doughnut: NO scales. Handing one an "r" axis makes
  //            Chart.js try to build a radialLinear scale for a controller
  //            that has none, and it throws reading a tick callback --
  //            measured, not guessed.
  //   radial   polarArea, radar: an "r" axis and nothing else.
  //   else     an x and a y.
  const sliced = kind === 'pie' || kind === 'doughnut';
  const round = sliced || kind === 'polar';
  const radial = kind === 'polar' || kind === 'radar';

  // Which Chart.js controller draws it. Several of our kinds are one of its
  // types plus options -- hbar is a bar with a swapped index axis, area is a
  // filled line, sbar is a stacked bar over rescaled numbers.
  const type =
